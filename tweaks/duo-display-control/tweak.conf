# Tweak: duo-display-control
# Unified keyboard docking, display enablement, geometry, and sensor rotation.

TWEAK_NAME="duo-display-control"
TWEAK_DESCRIPTION="Automatically manage both displays from keyboard and chassis orientation"

TWEAK_INFO="Controls the complete Zenbook Duo display state:
  Keyboard attached → normal landscape, eDP-2 off
  Keyboard detached → eDP-2 on, current orientation applied
  Device rotated → both enabled panels rotate after the configured delay

The physical keyboard, accelerometer orientation, panel rotations, positions,
and optional primary-display preference are reconciled through one script and
one KScreen lock. Each complete dock/detach state is applied atomically.
Virtual keyboards created by input-remapper are ignored.

Config:
  /etc/default/zenbook-duo-display-control
  LOWER_DISPLAY_PRIMARY_WHEN_DETACHED=0|1
  ROTATION_STABILITY_DELAY_SECONDS=0..10

Use the TUI's Set rotation delay action to apply a new delay immediately.
Decimal values such as 0.5 and 0.25 are supported; 0 rotates immediately.

Sensor firmware:
  - Downloads only the official ASUS UX8407 Sensor Solution package
  - Verifies both the package and extracted firmware SHA-256
  - Installs the ASUS image under /usr/lib/firmware/updates
  - Includes the override in initramfs without replacing Fedora firmware
  - Does not store or redistribute firmware in this repository

Installing over display-toggle and/or auto-rotate preserves the existing
primary-display choice and removes their superseded project-owned services.
A reboot is required after first install or uninstall to select the firmware.

Validate:
  zenbook-duo-display-control.sh status
  systemctl status zenbook-duo-display-control.service
  journalctl -t zenbook-duo-display-control -n 50 --no-pager"

TWEAK_FILES=(
	"zenbook-duo-display-control.sh:/usr/local/bin/zenbook-duo-display-control.sh:755"
	"zenbook-duo-display-control.service:/etc/systemd/system/zenbook-duo-display-control.service:644"
	"zenbook-duo-display-control@.service:/etc/systemd/system/zenbook-duo-display-control@.service:644"
	"99-zenbook-duo-display-control.rules:/etc/udev/rules.d/99-zenbook-duo-display-control.rules:644"
	"90-zenbook-duo-display-control.conf:/etc/dracut.conf.d/90-zenbook-duo-display-control.conf:644"
)

TWEAK_ACTIONS=(
	"Display and sensor status:duo_display_action_status"
	"Set rotation delay:duo_display_action_set_rotation_delay"
)

DUO_DISPLAY_CONFIG_FILE="/etc/default/zenbook-duo-display-control"
DUO_DISPLAY_CONFIG_MARKER="# Managed by Zenbook-Duo-Tweaks duo-display-control"
DUO_DISPLAY_LEGACY_CONFIG_FILE="/etc/default/zenbook-duo-display-toggle"
DUO_DISPLAY_LEGACY_CONFIG_MARKER="# Managed by Zenbook-Duo-Tweaks display-toggle"
DUO_DISPLAY_DRIVER_URL="https://dlcdnets.asus.com/pub/ASUS/nb/Image/Driver/Chipset/46988/SensorHub_DCH_Intel_Z_V5.8.56.0_46988.exe?model=UX8407AA"
DUO_DISPLAY_DRIVER_SHA256="5bd47748e35913f0ab641686908935a0cde928ca246f6e37ef840158f6846251"
DUO_DISPLAY_FIRMWARE_SHA256="e031f54f5a4fbdc51dc9beb3937f52fdc5d2ba00f005313cf73a8cfe0f9b2060"
DUO_DISPLAY_FIRMWARE_ARCHIVE_PATH="IshHeciExtensionTemplate/x64/FWImage/0004/AsusSign_ishS_SI_CommonPTL_5.8.1.7779_V0018.bin"
DUO_DISPLAY_FIRMWARE_DEST="/usr/lib/firmware/updates/intel/ish/ish_ptl.bin"
DUO_DISPLAY_LEGACY_FILES=(
	"/usr/local/bin/zenbook-duo-display-toggle.sh"
	"/etc/systemd/system/zenbook-duo-display-toggle@.service"
	"/etc/systemd/system/zenbook-duo-display-boot-check.service"
	"/etc/udev/rules.d/99-zenbook-duo-keyboard-display.rules"
	"/usr/local/bin/zenbook-duo-auto-rotate.sh"
	"/etc/systemd/system/zenbook-duo-auto-rotate.service"
	"/etc/systemd/system/zenbook-duo-auto-rotate@.service"
	"/etc/udev/rules.d/99-zenbook-duo-keyboard-auto-rotate.rules"
	"/etc/dracut.conf.d/90-zenbook-duo-auto-rotate.conf"
)

duo_display_file_sha256()
{
	sha256sum "$1" 2>/dev/null | awk '{print $1}'
}

duo_display_firmware_is_managed()
{
	[[ -f "${DUO_DISPLAY_FIRMWARE_DEST}" ]] &&
		[[ "$(duo_display_file_sha256 "${DUO_DISPLAY_FIRMWARE_DEST}")" == "${DUO_DISPLAY_FIRMWARE_SHA256}" ]]
}

duo_display_config_is_managed()
{
	[[ -f "${DUO_DISPLAY_CONFIG_FILE}" ]] && grep -qxF "${DUO_DISPLAY_CONFIG_MARKER}" "${DUO_DISPLAY_CONFIG_FILE}"
}

duo_display_legacy_config_is_managed()
{
	[[ -f "${DUO_DISPLAY_LEGACY_CONFIG_FILE}" ]] && grep -qxF "${DUO_DISPLAY_LEGACY_CONFIG_MARKER}" "${DUO_DISPLAY_LEGACY_CONFIG_FILE}"
}

duo_display_config_truthy()
{
	local file="$1"
	local key="$2"
	grep -Eiq "^[[:space:]]*${key}[[:space:]]*=[[:space:]]*(1|true|yes|on)[[:space:]]*$" "${file}" 2>/dev/null
}

duo_display_get_primary_choice()
{
	if [[ -f "${DUO_DISPLAY_CONFIG_FILE}" ]]; then
		duo_display_config_truthy "${DUO_DISPLAY_CONFIG_FILE}" "LOWER_DISPLAY_PRIMARY_WHEN_DETACHED" && echo 1 || echo 0
	elif [[ -f "${DUO_DISPLAY_LEGACY_CONFIG_FILE}" ]]; then
		duo_display_config_truthy "${DUO_DISPLAY_LEGACY_CONFIG_FILE}" "SWITCH_PRIMARY_ON_TOGGLE" && echo 1 || echo 0
	else
		echo 0
	fi
}

duo_display_delay_is_valid()
{
	local value="$1"

	[[ "${value}" =~ ^([0-9]+([.][0-9]+)?|[.][0-9]+)$ ]] || return 1
	LC_ALL=C awk -v value="${value}" 'BEGIN { exit !(value >= 0 && value <= 10) }'
}

duo_display_get_rotation_delay()
{
	local value

	value="$(awk -F= '/^[[:space:]]*ROTATION_STABILITY_DELAY_SECONDS[[:space:]]*=/ { value=$2 } END { gsub(/[[:space:]]/, "", value); print value }' "${DUO_DISPLAY_CONFIG_FILE}" 2>/dev/null || true)"
	if duo_display_delay_is_valid "${value}"; then
		echo "${value}"
	else
		echo 1
	fi
}

duo_display_write_config()
{
	local choice="$1"
	local rotation_delay="$2"

	mkdir -p "$(dirname "${DUO_DISPLAY_CONFIG_FILE}")"
	{
		echo "${DUO_DISPLAY_CONFIG_MARKER}"
		echo "# 1 makes eDP-2 primary while detached; 0 preserves the current primary."
		echo "LOWER_DISPLAY_PRIMARY_WHEN_DETACHED=${choice}"
		echo "# Stable orientation time in seconds; accepts decimal values from 0 through 10."
		echo "ROTATION_STABILITY_DELAY_SECONDS=${rotation_delay}"
	} > "${DUO_DISPLAY_CONFIG_FILE}"
	chmod 644 "${DUO_DISPLAY_CONFIG_FILE}"
}

duo_display_legacy_artifacts_exist()
{
	local file

	for file in "${DUO_DISPLAY_LEGACY_FILES[@]}"; do
		[[ -e "${file}" ]] && return 0
	done
	duo_display_legacy_config_is_managed
}

duo_display_remove_legacy_install()
{
	local file

	systemctl disable --now zenbook-duo-display-boot-check.service 2>/dev/null || true
	systemctl disable --now zenbook-duo-auto-rotate.service 2>/dev/null || true
	systemctl stop zenbook-duo-display-toggle@sync.service 2>/dev/null || true
	systemctl stop zenbook-duo-auto-rotate@sync.service 2>/dev/null || true
	for file in "${DUO_DISPLAY_LEGACY_FILES[@]}"; do
		if [[ -e "${file}" ]]; then
			rm -f -- "${file}"
			echo "  Removed superseded project file: ${file}"
		fi
	done
	if duo_display_legacy_config_is_managed; then
		rm -f -- "${DUO_DISPLAY_LEGACY_CONFIG_FILE}"
		echo "  Migrated and removed legacy display-toggle config."
	elif [[ -e "${DUO_DISPLAY_LEGACY_CONFIG_FILE}" ]]; then
		echo "  Left unmanaged legacy config untouched: ${DUO_DISPLAY_LEGACY_CONFIG_FILE}"
	fi
	rm -f -- \
		/run/zenbook-duo-display-toggle.lock \
		/run/zenbook-duo-display-toggle.state \
		/run/zenbook-duo-auto-rotate.state
}

duo_display_action_status()
{
	if [[ -x /usr/local/bin/zenbook-duo-display-control.sh ]]; then
		/usr/local/bin/zenbook-duo-display-control.sh status
	else
		echo "  duo-display-control is not installed."
		return 1
	fi
}

duo_display_action_set_rotation_delay()
{
	local current_choice current_delay new_delay

	if [[ "${EUID}" -ne 0 ]]; then
		echo "  ERROR: Run zenbook-tweaks with sudo to change the rotation delay."
		return 1
	fi
	if ! duo_display_config_is_managed; then
		echo "  ERROR: Managed duo-display-control config was not found."
		return 1
	fi

	current_choice="$(duo_display_get_primary_choice)"
	current_delay="$(duo_display_get_rotation_delay)"
	echo "  Current rotation delay: ${current_delay} second(s)"
	echo "  Enter a new delay from 0 through 10 seconds (decimals allowed):"
	read -r new_delay </dev/tty || new_delay=""
	if [[ -z "${new_delay}" ]]; then
		echo "  No change made."
		return 0
	fi
	if ! duo_display_delay_is_valid "${new_delay}"; then
		echo "  ERROR: Use a number from 0 through 10, for example 0.25, 0.5, or 1."
		return 1
	fi

	duo_display_write_config "${current_choice}" "${new_delay}"
	echo "  Rotation delay set to ${new_delay} second(s); it applies on the next orientation event."
}

tweak_status_check()
{
	local tweak_dir entry source_file destination permissions
	local installed_files=0 modified_files=0 total_files="${#TWEAK_FILES[@]}"

	tweak_dir="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
	for entry in "${TWEAK_FILES[@]}"; do
		IFS=':' read -r source_file destination permissions <<< "${entry}"
		if [[ -f "${destination}" ]]; then
			installed_files=$((installed_files + 1))
			cmp -s "${tweak_dir}/${source_file}" "${destination}" || modified_files=$((modified_files + 1))
		fi
	done

	if duo_display_legacy_artifacts_exist; then
		echo "partially installed"
	elif [[ "${installed_files}" -eq 0 ]] && [[ ! -e "${DUO_DISPLAY_FIRMWARE_DEST}" ]]; then
		echo "not installed"
	elif [[ "${installed_files}" -lt "${total_files}" ]] || ! duo_display_firmware_is_managed; then
		echo "partially installed"
	elif [[ "${modified_files}" -gt 0 ]]; then
		echo "installed (modified)"
	else
		echo "installed"
	fi
}

tweak_pre_install()
{
	local packages=(curl 7zip dracut iio-sensor-proxy jq libkscreen util-linux)
	local temp_dir package_file raw_dir extract_dir firmware_source
	local sensor_hub_found=false pci_device vendor_id device_id

	if [[ "$(cat /sys/class/dmi/id/product_name 2>/dev/null || true)" != "Zenbook Duo UX8407AA" ]]; then
		echo "  ERROR: This firmware is restricted to ASUS Zenbook Duo UX8407AA."
		return 1
	fi
	for pci_device in /sys/bus/pci/devices/*; do
		[[ -r "${pci_device}/vendor" && -r "${pci_device}/device" ]] || continue
		read -r vendor_id < "${pci_device}/vendor" || continue
		read -r device_id < "${pci_device}/device" || continue
		if [[ "${vendor_id,,}" == "0x8086" && "${device_id,,}" == "0xe445" ]]; then
			sensor_hub_found=true
			break
		fi
	done
	if [[ "${sensor_hub_found}" != true ]]; then
		echo "  ERROR: Intel Panther Lake Sensor Hub 8086:e445 was not found."
		return 1
	fi

	echo "  Installing runtime dependencies..."
	if ! dnf install -y "${packages[@]}" >/dev/null 2>&1; then
		echo "  ERROR: Failed to install duo-display-control dependencies."
		return 1
	fi
	if duo_display_firmware_is_managed; then
		echo "  Verified ASUS sensor firmware is already installed."
		return 0
	fi
	if [[ -e "${DUO_DISPLAY_FIRMWARE_DEST}" ]]; then
		echo "  ERROR: Refusing to replace an unmanaged firmware override:"
		echo "    ${DUO_DISPLAY_FIRMWARE_DEST}"
		return 1
	fi

	temp_dir="$(mktemp -d /tmp/zenbook-duo-display-control.XXXXXX)"
	package_file="${temp_dir}/SensorHub.exe"
	raw_dir="${temp_dir}/raw"
	extract_dir="${temp_dir}/extracted"
	mkdir -p "${raw_dir}" "${extract_dir}"
	echo "  Downloading official ASUS UX8407 sensor package..."
	if ! curl -L --fail --progress-bar -o "${package_file}" "${DUO_DISPLAY_DRIVER_URL}"; then
		rm -rf -- "${temp_dir}"
		echo "  ERROR: ASUS sensor package download failed."
		return 1
	fi
	if [[ "$(duo_display_file_sha256 "${package_file}")" != "${DUO_DISPLAY_DRIVER_SHA256}" ]]; then
		rm -rf -- "${temp_dir}"
		echo "  ERROR: ASUS package checksum mismatch; nothing was installed."
		return 1
	fi
	if ! 7z x -y -t# -o"${raw_dir}" "${package_file}" >/dev/null ||
		[[ ! -f "${raw_dir}/3.7z" ]] ||
		! 7z x -y -o"${extract_dir}" "${raw_dir}/3.7z" "${DUO_DISPLAY_FIRMWARE_ARCHIVE_PATH}" >/dev/null
	then
		rm -rf -- "${temp_dir}"
		echo "  ERROR: Could not extract the ASUS sensor firmware."
		return 1
	fi
	firmware_source="${extract_dir}/${DUO_DISPLAY_FIRMWARE_ARCHIVE_PATH}"
	if [[ "$(duo_display_file_sha256 "${firmware_source}")" != "${DUO_DISPLAY_FIRMWARE_SHA256}" ]]; then
		rm -rf -- "${temp_dir}"
		echo "  ERROR: Extracted ASUS firmware checksum mismatch."
		return 1
	fi
	install -Dm0644 "${firmware_source}" "${DUO_DISPLAY_FIRMWARE_DEST}"
	rm -rf -- "${temp_dir}"
	echo "  Installed verified ASUS firmware override."
}

tweak_post_install()
{
	local current_choice current_delay new_choice prompt reply migrating=false

	[[ ! -f "${DUO_DISPLAY_CONFIG_FILE}" && -f "${DUO_DISPLAY_LEGACY_CONFIG_FILE}" ]] && migrating=true
	current_choice="$(duo_display_get_primary_choice)"
	current_delay="$(duo_display_get_rotation_delay)"
	new_choice="${current_choice}"
	if [[ "${migrating}" == true ]]; then
		echo "  Preserving legacy lower-display primary choice: ${new_choice}"
	elif [[ -f "${DUO_DISPLAY_CONFIG_FILE}" ]] && ! duo_display_config_is_managed; then
		echo "  Existing unmanaged config found; leaving it unchanged:"
		echo "    ${DUO_DISPLAY_CONFIG_FILE}"
	else
		[[ "${current_choice}" == 1 ]] && prompt="[Y/n]" || prompt="[y/N]"
		echo "  Make eDP-2 the KDE primary display while detached? ${prompt}"
		read -r reply </dev/tty || reply=""
		case "${reply}" in
			[yY]|[yY][eE][sS]) new_choice=1 ;;
			[nN]|[nN][oO]) new_choice=0 ;;
			"") ;;
			*) echo "  Unrecognized answer; keeping current default." ;;
		esac
	fi
	if [[ ! -f "${DUO_DISPLAY_CONFIG_FILE}" ]] || duo_display_config_is_managed; then
		duo_display_write_config "${new_choice}" "${current_delay}"
	fi

	duo_display_remove_legacy_install
	echo "  Regenerating initramfs images with the ASUS sensor firmware..."
	dracut --regenerate-all --force
	systemctl daemon-reload
	udevadm control --reload-rules
	systemctl enable --now zenbook-duo-display-control.service
	echo "  Enabled unified display control and reloaded udev rules."
	echo "  Reboot required to validate persistent Sensor Hub firmware selection."
}

tweak_pre_uninstall()
{
	systemctl disable --now zenbook-duo-display-control.service 2>/dev/null || true
	systemctl stop zenbook-duo-display-control@sync.service 2>/dev/null || true
}

tweak_post_uninstall()
{
	if duo_display_config_is_managed; then
		rm -f -- "${DUO_DISPLAY_CONFIG_FILE}"
		echo "  Removed managed config: ${DUO_DISPLAY_CONFIG_FILE}"
	elif [[ -e "${DUO_DISPLAY_CONFIG_FILE}" ]]; then
		echo "  Left unmanaged config untouched: ${DUO_DISPLAY_CONFIG_FILE}"
	fi
	if duo_display_firmware_is_managed; then
		rm -f -- "${DUO_DISPLAY_FIRMWARE_DEST}"
		echo "  Removed managed ASUS sensor firmware override."
	elif [[ -e "${DUO_DISPLAY_FIRMWARE_DEST}" ]]; then
		echo "  Left modified/unmanaged firmware override untouched: ${DUO_DISPLAY_FIRMWARE_DEST}"
	fi
	rm -f -- /run/zenbook-duo-display-control.state
	echo "  Regenerating initramfs images without the managed firmware override..."
	dracut --regenerate-all --force
	systemctl daemon-reload
	udevadm control --reload-rules
	echo "  Reboot required to return the Sensor Hub to Fedora firmware."
}
