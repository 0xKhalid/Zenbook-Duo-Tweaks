# Tweak: display-toggle
# Reconcile eDP-2 with the physical keyboard dock state (udev + systemd + kscreen-doctor)

TWEAK_NAME="display-toggle"
TWEAK_DESCRIPTION="Sync eDP-2 with the physical keyboard dock state + optional primary switch"

TWEAK_INFO="Synchronizes eDP-2 with the physical keyboard dock state:
  Keyboard attached → eDP-2 OFF
  Keyboard detached → eDP-2 ON
  Boot → checks keyboard presence, sets eDP-2 accordingly

Uses physical USB events + systemd + kscreen-doctor. Both attach
and detach events start one sync action. After a short settling
delay, the script checks /sys/bus/usb/devices for the real USB
keyboard (0b05:1cd7) and applies the current hardware state.
Virtual keyboards created by input-remapper are ignored.

v2.3 adds an install option to make KDE treat eDP-2 as
the primary display whenever eDP-2 is enabled. This is like
KDE/Windows \"make this my main display\" behavior. It does not
swap or rewrite physical screen positions:
  eDP-1 remains at 0,0
  eDP-2 remains at 0,1125

At boot, a separate service uses the same physical USB check to
detect whether the keyboard is present and enables/disables
eDP-2 automatically — no manual
plug/unplug needed. If login is delayed, the boot check retries
until the KDE/Wayland session, DBus socket, Wayland socket, and
KWin are ready before calling kscreen-doctor.
Only the physically docked USB keyboard is treated as attached;
Bluetooth keyboard mode is treated as detached.

Config:
  /etc/default/zenbook-duo-display-toggle
  SWITCH_PRIMARY_ON_TOGGLE=0|1

Startup reliability:
  - Serializes display changes with a runtime lock
  - Coalesces add/remove events through one sync service
  - Reconciles current physical state instead of trusting event direction
  - Debounces duplicate resolved actions for 30 seconds
  - Avoids calling kscreen-doctor before KDE/Wayland is ready

Validate:
  sudo systemctl start zenbook-duo-display-toggle@sync.service
  sudo systemctl start zenbook-duo-display-boot-check.service
  journalctl -t zenbook-duo-display-toggle -n 50 --no-pager

If your keyboard IDs differ, edit the udev rules file.
Find your values with:
  sudo udevadm monitor --udev --subsystem-match=input"

# Files: "source_filename:dest_absolute_path:permissions"
TWEAK_FILES=(
	"zenbook-duo-display-toggle.sh:/usr/local/bin/zenbook-duo-display-toggle.sh:755"
	"zenbook-duo-display-toggle@.service:/etc/systemd/system/zenbook-duo-display-toggle@.service:644"
	"zenbook-duo-display-boot-check.service:/etc/systemd/system/zenbook-duo-display-boot-check.service:644"
	"99-zenbook-duo-keyboard-display.rules:/etc/udev/rules.d/99-zenbook-duo-keyboard-display.rules:644"
)

DISPLAY_TOGGLE_CONFIG_FILE="/etc/default/zenbook-duo-display-toggle"
DISPLAY_TOGGLE_CONFIG_MARKER="# Managed by Zenbook-Duo-Tweaks display-toggle"

display_toggle_config_is_managed()
{
	[[ -f "${DISPLAY_TOGGLE_CONFIG_FILE}" ]] && grep -qxF "${DISPLAY_TOGGLE_CONFIG_MARKER}" "${DISPLAY_TOGGLE_CONFIG_FILE}"
}

display_toggle_get_primary_choice()
{
	local PrimaryRegex
	PrimaryRegex='^[[:space:]]*SWITCH_PRIMARY_ON_TOGGLE[[:space:]]*=[[:space:]]*(1|true|yes|on)[[:space:]]*$'

	if [[ -f "${DISPLAY_TOGGLE_CONFIG_FILE}" ]] &&
		grep -Eiq "${PrimaryRegex}" "${DISPLAY_TOGGLE_CONFIG_FILE}"
	then
		echo "1"
	else
		echo "0"
	fi
}

display_toggle_write_config()
{
	local PrimaryChoice="$1"

	mkdir -p "$(dirname "${DISPLAY_TOGGLE_CONFIG_FILE}")"
	{
		echo "${DISPLAY_TOGGLE_CONFIG_MARKER}"
		echo "# Optional KDE primary-display behavior for the display-toggle tweak."
		echo "# 0 = only enable/disable eDP-2; 1 = make eDP-2 primary when enabled."
		echo "SWITCH_PRIMARY_ON_TOGGLE=${PrimaryChoice}"
	} > "${DISPLAY_TOGGLE_CONFIG_FILE}"
	chmod 644 "${DISPLAY_TOGGLE_CONFIG_FILE}"
}

tweak_post_install()
{
	local CurrentChoice
	local NewChoice
	local Prompt
	local Reply

	CurrentChoice="$(display_toggle_get_primary_choice)"

	if [[ -f "${DISPLAY_TOGGLE_CONFIG_FILE}" ]] && ! display_toggle_config_is_managed; then
		echo "  Existing unmanaged config found:"
		echo "    ${DISPLAY_TOGGLE_CONFIG_FILE}"
		echo "  Leaving it unchanged."
	else
		NewChoice="${CurrentChoice}"
		if [[ "${CurrentChoice}" == "1" ]]; then
			Prompt="[Y/n]"
		else
			Prompt="[y/N]"
		fi

		echo "  Make eDP-2 the KDE primary display when it is enabled? ${Prompt}"
		read -r Reply </dev/tty || Reply=""

		case "${Reply}" in
			[yY]|[yY][eE][sS])
				NewChoice="1"
				;;
			[nN]|[nN][oO])
				NewChoice="0"
				;;
			"")
				;;
			*)
				echo "  Unrecognized answer; keeping current default."
				;;
		esac

		display_toggle_write_config "${NewChoice}"
		if [[ "${NewChoice}" == "1" ]]; then
			echo "  Primary switching enabled for eDP-2."
		else
			echo "  Primary switching disabled; current display-toggle behavior preserved."
		fi
	fi

	systemctl daemon-reload
	udevadm control --reload-rules
	systemctl enable zenbook-duo-display-boot-check.service
	echo "  Reloaded systemd and udev rules."
	echo "  Enabled boot-time display check."
}

tweak_post_uninstall()
{
	systemctl disable zenbook-duo-display-boot-check.service 2>/dev/null || true

	if display_toggle_config_is_managed; then
		rm -f "${DISPLAY_TOGGLE_CONFIG_FILE}"
		echo "  Removed managed config: ${DISPLAY_TOGGLE_CONFIG_FILE}"
	elif [[ -f "${DISPLAY_TOGGLE_CONFIG_FILE}" ]]; then
		echo "  Left unmanaged config untouched: ${DISPLAY_TOGGLE_CONFIG_FILE}"
	fi

	systemctl daemon-reload
	udevadm control --reload-rules
	echo "  Disabled boot-time display check."
	echo "  Reloaded systemd and udev rules."
}
