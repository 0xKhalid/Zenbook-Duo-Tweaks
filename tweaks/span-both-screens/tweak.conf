# Tweak: span-both-screens
# Deliberate dual-panel window spanning with Fedora's stock KWin.

TWEAK_NAME="span-both-screens"
TWEAK_DESCRIPTION="Span maximized windows across both screens"
TWEAK_SUMMARY="Makes maximized apps span both built-in displays.
Dragging and snapping continue to work normally on each individual screen."

TWEAK_INFO="Uses a KWin script with Fedora's standard compositor.

When eDP-1 and eDP-2 are both active:
  Maximize button → span the window across both screens
  Titlebar double-click → span or restore the window
  Meta+PgUp → span or restore the window
  Titlebar menu → Span Both Screens / Restore Window
  Drag a spanned window → restore its previous size under the pointer

Drag-to-top maximize, side and corner snapping, fullscreen, and Plasma tiling
remain native per-screen actions.

Rotation recalculates the combined geometry. Docking fits a spanned window on
eDP-1, and detaching re-spans only windows that were previously spanned.

Status:
  zenbook-duo-span-both-screens status"

TWEAK_FILES=(
	"metadata.json:/usr/share/kwin/scripts/zenbookduospanbothscreens/metadata.json:644"
	"contents/code/main.js:/usr/share/kwin/scripts/zenbookduospanbothscreens/contents/code/main.js:644"
	"zenbook-duo-span-both-screens:/usr/local/bin/zenbook-duo-span-both-screens:755"
)

TWEAK_ACTIONS=(
	"Window spanning status:span_both_screens_action_status"
)

SPAN_BOTH_SCREENS_PLUGIN_ID="zenbookduospanbothscreens"
SPAN_BOTH_SCREENS_SOURCE_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
SPAN_BOTH_SCREENS_ALREADY_MANAGED=false

span_both_screens_target_user()
{
	if [[ -n "${SUDO_USER:-}" && "${SUDO_USER}" != root ]]; then
		echo "${SUDO_USER}"
	elif [[ "${EUID}" -ne 0 ]]; then
		id -un
	else
		return 1
	fi
}

span_both_screens_user_home()
{
	local user
	user="$(span_both_screens_target_user)" || return 1
	getent passwd "${user}" | cut -d: -f6
}

span_both_screens_plugin_enabled()
{
	local user home uid value
	user="$(span_both_screens_target_user)" || return 1
	home="$(span_both_screens_user_home)" || return 1
	uid="$(id -u "${user}")"
	if [[ "${EUID}" -eq 0 ]]; then
		value="$(runuser -u "${user}" -- env HOME="${home}" XDG_RUNTIME_DIR="/run/user/${uid}" \
			kreadconfig6 --file kwinrc --group Plugins \
			--key "${SPAN_BOTH_SCREENS_PLUGIN_ID}Enabled" --default false 2>/dev/null || true)"
	else
		value="$(kreadconfig6 --file kwinrc --group Plugins \
			--key "${SPAN_BOTH_SCREENS_PLUGIN_ID}Enabled" --default false 2>/dev/null || true)"
	fi
	[[ "${value}" == true ]]
}

span_both_screens_files_status()
{
	local entry src dest perm total=0 present=0 modified=0
	for entry in "${TWEAK_FILES[@]}"; do
		IFS=':' read -r src dest perm <<< "${entry}"
		total=$((total + 1))
		if [[ -f "${dest}" ]]; then
			present=$((present + 1))
			cmp -s "${SPAN_BOTH_SCREENS_SOURCE_DIR}/${src}" "${dest}" || modified=$((modified + 1))
		fi
	done
	printf '%s %s %s\n' "${total}" "${present}" "${modified}"
}

tweak_status_check()
{
	local total present modified
	read -r total present modified < <(span_both_screens_files_status)
	if [[ "${present}" -eq 0 ]]; then
		echo "not installed"
	elif [[ "${present}" -lt "${total}" ]]; then
		echo "partially installed"
	elif [[ "${modified}" -gt 0 ]]; then
		echo "installed (modified)"
	elif ! span_both_screens_plugin_enabled; then
		echo "partially installed"
	else
		echo "installed"
	fi
}

span_both_screens_action_status()
{
	local user=""
	user="$(span_both_screens_target_user 2>/dev/null || true)"
	if [[ ! -x /usr/local/bin/zenbook-duo-span-both-screens ]]; then
		echo "  Span Both Screens is not installed."
		return 1
	fi
	/usr/local/bin/zenbook-duo-span-both-screens status "${user}"
}

tweak_pre_install()
{
	local metadata="/usr/share/kwin/scripts/${SPAN_BOTH_SCREENS_PLUGIN_ID}/metadata.json"
	if [[ -r "${metadata}" ]] && grep -q '"Id": "zenbookduospanbothscreens"' "${metadata}"; then
		SPAN_BOTH_SCREENS_ALREADY_MANAGED=true
	fi
	span_both_screens_target_user >/dev/null || {
		echo "  ERROR: Run the TUI with sudo from the Plasma user who will use this tweak."
		return 1
	}
}

tweak_post_install()
{
	local user entry src dest perm backup
	user="$(span_both_screens_target_user)"
	/usr/local/bin/zenbook-duo-span-both-screens install "${user}"

	if [[ "${SPAN_BOTH_SCREENS_ALREADY_MANAGED}" == true ]]; then
		for entry in "${TWEAK_FILES[@]}"; do
			IFS=':' read -r src dest perm <<< "${entry}"
			backup="${BACKUP_DIR}/${TWEAK_NAME}${dest}"
			rm -f -- "${backup}"
		done
		find "${BACKUP_DIR}/${TWEAK_NAME}" -type d -empty -delete 2>/dev/null || true
	fi
}

tweak_pre_uninstall()
{
	local user
	user="$(span_both_screens_target_user)" || {
		echo "  ERROR: Run the TUI with sudo from the Plasma user who owns the tweak."
		return 1
	}
	if [[ -x /usr/local/bin/zenbook-duo-span-both-screens ]]; then
		/usr/local/bin/zenbook-duo-span-both-screens uninstall "${user}"
	fi
}
