# Tweak: kbd-backlight
# Complete, reversible ASUS detachable-keyboard backlight integration.

TWEAK_NAME="kbd-backlight"
TWEAK_DESCRIPTION="Control the detachable keyboard backlight"
TWEAK_SUMMARY="Makes the keyboard's Fn+F4 backlight key work over USB or Bluetooth.
Starts each connection at Low and saves power after configurable inactivity."

TWEAK_INFO="Controls the ASUS Zenbook Duo detachable keyboard with its verified
HID feature report while keeping the existing Fn+F4 behavior.

Supported hardware:
  USB:       0B05:1CD7, vendor HID interface 04/input4
  Bluetooth: 0B05:1CD8, vendor hid-generic interface
  Report:    5A BA C5 C4 <level>, levels 0 through 3

After a fresh USB or Bluetooth connection, the keyboard can return an empty
level until its first feature write. Cycling seeds that one write from the
private locked cache and then requires matching hardware readback. Saved state
is always described as the cached last successful request, never as current
hardware unless a read actually succeeds.

Commands:
  kbd-backlight             cycle Off -> Low -> Medium -> High -> Off
  kbd-backlight cycle       same as the no-argument command
  kbd-backlight set 0-3     request a specific level
  kbd-backlight get         read the verified hardware level when available
  kbd-backlight status      privacy-safe device and KDE diagnostics

Access is limited to the active local session with udev uaccess. Installation
does not leave the user in the broad input group. Rapid key presses are
serialized, and private cached state is updated atomically under the user's XDG
state directory.

Automatic lighting starts every login or connection at Low. A manual Fn+F4
choice remains preferred for that connection, while 15 minutes of keyboard and
detachable-touchpad inactivity temporarily turns the light off. Activity
restores the preferred level; a manual Off choice stays off. The timeout is
configurable and automatic management can be disabled without affecting Fn+F4.

Installation adopts the single existing KDE launcher and its F4 shortcut,
preserving their exact previous state for Uninstall. It refuses F4 conflicts,
unsafe files, ambiguous HID interfaces, or incomplete rollback data."

# This tweak owns user-session integration and legacy migration in its hooks.
TWEAK_FILES=()

TWEAK_ACTIONS=(
	"Keyboard backlight status:kbd_backlight_action_status"
	"Automatic lighting settings:kbd_backlight_action_configure"
)

_KBL_SOURCE_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
_KBL_SCRIPT_SOURCE="${_KBL_SOURCE_DIR}/kbd-backlight.sh"
_KBL_RULE_SOURCE="${_KBL_SOURCE_DIR}/70-asus-kbd-backlight.rules"
_KBL_LAUNCHER_SOURCE="${_KBL_SOURCE_DIR}/net.local.kbd-backlight.desktop"
_KBL_ACTIVITY_SOURCE="${_KBL_SOURCE_DIR}/kbd-backlight-activity"
_KBL_UNIT_SOURCE="${_KBL_SOURCE_DIR}/zenbook-duo-kbd-backlight-activity.service"
_KBL_SCRIPT_DEST="${KBD_TWEAK_SCRIPT_DEST:-/usr/local/bin/kbd-backlight}"
_KBL_RULE_DEST="${KBD_TWEAK_RULE_DEST:-/etc/udev/rules.d/70-asus-kbd-backlight.rules}"
_KBL_ACTIVITY_DEST="${KBD_TWEAK_ACTIVITY_DEST:-/usr/local/libexec/kbd-backlight-activity}"
_KBL_UNIT_DEST="${KBD_TWEAK_UNIT_DEST:-/usr/local/lib/systemd/user/zenbook-duo-kbd-backlight-activity.service}"
_KBL_LEGACY_RULE="${KBD_TWEAK_LEGACY_RULE:-/etc/udev/rules.d/99-asus-kbd-backlight.rules}"
_KBL_LEGACY_TMP="${KBD_TWEAK_LEGACY_TMP:-/tmp/kbd-backlight-level}"
_KBL_RECORD_DIR="${STATE_DIR}/kbd-backlight"
_KBL_MANIFEST="${_KBL_RECORD_DIR}/manifest"
_KBL_AUTO_MANIFEST="${_KBL_RECORD_DIR}/automatic-manifest"
_KBL_BACKUP_ROOT="${BACKUP_DIR}/kbd-backlight"
_KBL_BACKUP_LAUNCHER="${_KBL_BACKUP_ROOT}/launcher.previous"
_KBL_BACKUP_SCRIPT="${_KBL_BACKUP_ROOT}/system/kbd-backlight.previous"
_KBL_BACKUP_RULE="${_KBL_BACKUP_ROOT}/system/70-asus-kbd-backlight.rules.previous"
_KBL_BACKUP_LEGACY_RULE="${_KBL_BACKUP_ROOT}/system/99-asus-kbd-backlight.rules.previous"
_KBL_BACKUP_LEGACY_TMP="${_KBL_BACKUP_ROOT}/legacy/kbd-backlight-level.previous"
_KBL_BACKUP_UNIT="${_KBL_BACKUP_ROOT}/system/zenbook-duo-kbd-backlight-activity.service.previous"
_KBL_BACKUP_ACTIVITY="${_KBL_BACKUP_ROOT}/system/kbd-backlight-activity.previous"
_KBL_BACKUP_CONFIG="${_KBL_BACKUP_ROOT}/user/kbd-backlight.conf.previous"
_KBL_TXN_DIR="${_KBL_RECORD_DIR}/transaction"
_KBL_LEGACY_SCRIPT_SHA256="da65546c66731fd21f1d06509a76a2cc18ab2b0b18c093135084c89b86c029f4"
_KBL_LEGACY_RULE_SHA256="655cf15f533826da0ea1f1774e1cfa7dd4c31a2fc5f42476f4b182db4ab363bc"
_KBL_PRIOR_MANAGED_SCRIPT_SHA256="d858f22cd34f80d4e5b5a8cee061e1204b35e01f1652d36911b5e5a42470df03"
_KBL_V213_MANAGED_SCRIPT_SHA256="7635be07fcc9b8afc6344b8adc5d95a282883b8afdbee1cbcf95cd9ab355b9ec"
_KBL_V213_MANAGED_RULE_SHA256="f605c5063e3b2af1c5af98f854659d46b3ea9ff659559d466039398a8c664cd5"
_KBL_ACTION_ID="['net.local.kbd-backlight.desktop','_launch','ASUS Keyboard Backlight Toggle','ASUS Keyboard Backlight Toggle']"
_KBL_STATE_OWNER_UID="${KBD_TWEAK_STATE_OWNER_UID:-0}"
_KBL_STATE_OWNER_GID="${KBD_TWEAK_STATE_OWNER_GID:-0}"
_KBL_SYSTEM_OWNER="${KBD_TWEAK_SYSTEM_OWNER:-root}"
_KBL_SYSTEM_GROUP="${KBD_TWEAK_SYSTEM_GROUP:-root}"
_KBL_SYSTEM_UID="${KBD_TWEAK_SYSTEM_UID:-0}"
_KBL_SYSTEM_GID="${KBD_TWEAK_SYSTEM_GID:-0}"
_KBL_TARGET_USER=""
_KBL_TARGET_UID=""
_KBL_TARGET_GID=""
_KBL_TARGET_HOME=""
_KBL_CAPTURE_STARTED=false

_kbl_encode()
{
	printf '%s' "$1" | base64 -w0
}

_kbl_decode()
{
	printf '%s' "$1" | base64 -d
}

_kbl_manifest_value()
{
	local key="$1"
	awk -F= -v key="${key}" '$1 == key { print substr($0, index($0, "=") + 1); exit }' \
		"${_KBL_MANIFEST}" 2>/dev/null
}

_kbl_sha256()
{
	sha256sum -- "$1" | awk '{print $1}'
}

_kbl_sha_matches()
{
	local path="$1"
	local expected="$2"
	[[ "${expected}" =~ ^[0-9a-f]{64}$ ]] || return 1
	[[ -f "${path}" && ! -L "${path}" ]] || return 1
	[[ "$(_kbl_sha256 "${path}")" == "${expected}" ]]
}

_kbl_manifest_valid()
{
	local phase uid gid launcher_present shortcut_present shortcut_runtime_present
	local input_member input_removed legacy_tmp_present legacy_tmp_level
	local state backup sha key

	[[ -f "${_KBL_MANIFEST}" && ! -L "${_KBL_MANIFEST}" ]] || return 1
	[[ "$(stat -Lc '%u:%g:%a' -- "${_KBL_MANIFEST}" 2>/dev/null)" == "${_KBL_STATE_OWNER_UID}:${_KBL_STATE_OWNER_GID}:600" ]] || return 1
	awk -F= '
		BEGIN {
			expected["version"]=1; expected["phase"]=1; expected["user"]=1
			expected["uid"]=1; expected["gid"]=1; expected["home_b64"]=1
			expected["launcher_present"]=1; expected["launcher_sha256"]=1
			expected["shortcut_present"]=1; expected["shortcut_value_b64"]=1
			expected["shortcut_runtime_present"]=1; expected["shortcut_keys_b64"]=1
			expected["input_member"]=1; expected["input_removed"]=1
			expected["script_state"]=1; expected["script_sha256"]=1
			expected["rule_state"]=1; expected["rule_sha256"]=1
			expected["legacy_rule_state"]=1; expected["legacy_rule_sha256"]=1
			expected["legacy_tmp_present"]=1; expected["legacy_tmp_level"]=1
			expected["legacy_tmp_sha256"]=1
		}
		{
			separator=index($0, "=")
			key=substr($0, 1, separator - 1)
			if (separator < 2 || !(key in expected) || seen[key]++) bad=1
		}
		END { for (key in expected) if (seen[key] != 1) bad=1; exit bad }
	' "${_KBL_MANIFEST}" || return 1
	[[ "$(_kbl_manifest_value version)" == 1 ]] || return 1
	phase="$(_kbl_manifest_value phase)"
	[[ "${phase}" == installing || "${phase}" == installed ]] || return 1
	[[ "$(_kbl_manifest_value user)" =~ ^[a-zA-Z_][a-zA-Z0-9_.-]*$ ]] || return 1
	uid="$(_kbl_manifest_value uid)"
	gid="$(_kbl_manifest_value gid)"
	[[ "${uid}" =~ ^[0-9]+$ && "${gid}" =~ ^[0-9]+$ ]] || return 1
	_kbl_decode "$(_kbl_manifest_value home_b64)" >/dev/null 2>&1 || return 1

	for key in launcher_present shortcut_present shortcut_runtime_present input_member input_removed legacy_tmp_present; do
		[[ "$(_kbl_manifest_value "${key}")" == 0 || "$(_kbl_manifest_value "${key}")" == 1 ]] || return 1
	done
	launcher_present="$(_kbl_manifest_value launcher_present)"
	shortcut_present="$(_kbl_manifest_value shortcut_present)"
	shortcut_runtime_present="$(_kbl_manifest_value shortcut_runtime_present)"
	input_member="$(_kbl_manifest_value input_member)"
	input_removed="$(_kbl_manifest_value input_removed)"
	[[ "${input_removed}" == 0 || "${input_member}" == 1 ]] || return 1

	if [[ "${launcher_present}" == 1 ]]; then
		_kbl_sha_matches "${_KBL_BACKUP_LAUNCHER}" "$(_kbl_manifest_value launcher_sha256)" || return 1
	else
		[[ "$(_kbl_manifest_value launcher_sha256)" == none ]] || return 1
		[[ ! -e "${_KBL_BACKUP_LAUNCHER}" && ! -L "${_KBL_BACKUP_LAUNCHER}" ]] || return 1
	fi
	if [[ "${shortcut_present}" == 1 ]]; then
		_kbl_decode "$(_kbl_manifest_value shortcut_value_b64)" >/dev/null 2>&1 || return 1
	else
		[[ "$(_kbl_manifest_value shortcut_value_b64)" == none ]] || return 1
	fi
	if [[ "${shortcut_runtime_present}" == 1 ]]; then
		_kbl_decode "$(_kbl_manifest_value shortcut_keys_b64)" >/dev/null 2>&1 || return 1
	else
		[[ "$(_kbl_manifest_value shortcut_keys_b64)" == none ]] || return 1
	fi

	for key in script rule legacy_rule; do
		state="$(_kbl_manifest_value "${key}_state")"
		sha="$(_kbl_manifest_value "${key}_sha256")"
		case "${key}" in
			script) backup="${_KBL_BACKUP_SCRIPT}" ;;
			rule) backup="${_KBL_BACKUP_RULE}" ;;
			legacy_rule) backup="${_KBL_BACKUP_LEGACY_RULE}" ;;
		esac
		case "${state}" in
			absent)
				[[ "${sha}" == none && ! -e "${backup}" && ! -L "${backup}" ]] || return 1
				;;
			managed|foreign)
				_kbl_sha_matches "${backup}" "${sha}" || return 1
				;;
			*) return 1 ;;
		esac
	done

	legacy_tmp_present="$(_kbl_manifest_value legacy_tmp_present)"
	legacy_tmp_level="$(_kbl_manifest_value legacy_tmp_level)"
	if [[ "${legacy_tmp_present}" == 1 ]]; then
		[[ "${legacy_tmp_level}" =~ ^[0-3]$ ]] || return 1
		_kbl_sha_matches "${_KBL_BACKUP_LEGACY_TMP}" "$(_kbl_manifest_value legacy_tmp_sha256)" || return 1
	else
		[[ "${legacy_tmp_level}" == none && "$(_kbl_manifest_value legacy_tmp_sha256)" == none ]] || return 1
		[[ ! -e "${_KBL_BACKUP_LEGACY_TMP}" && ! -L "${_KBL_BACKUP_LEGACY_TMP}" ]] || return 1
	fi
}

_kbl_set_manifest_value()
{
	local wanted="$1"
	local value="$2"
	local temporary
	temporary="${_KBL_MANIFEST}.tmp.$$"
	awk -F= -v wanted="${wanted}" -v value="${value}" '
		$1 == wanted { print wanted "=" value; next }
		{ print }
	' "${_KBL_MANIFEST}" > "${temporary}"
	chmod 600 -- "${temporary}"
	mv -f -- "${temporary}" "${_KBL_MANIFEST}"
}

_kbl_auto_manifest_value()
{
	local key="$1"
	awk -F= -v key="${key}" '$1 == key {print substr($0, index($0, "=") + 1); exit}' \
		"${_KBL_AUTO_MANIFEST}" 2>/dev/null
}

_kbl_config_path()
{
	printf '%s/.config/zenbook-tweaks/kbd-backlight.conf\n' "${_KBL_TARGET_HOME}"
}

_kbl_auto_manifest_valid()
{
	local phase state sha backup key present
	[[ -f "${_KBL_AUTO_MANIFEST}" && ! -L "${_KBL_AUTO_MANIFEST}" ]] || return 1
	[[ "$(stat -Lc '%u:%g:%a' -- "${_KBL_AUTO_MANIFEST}" 2>/dev/null)" == \
		"${_KBL_STATE_OWNER_UID}:${_KBL_STATE_OWNER_GID}:600" ]] || return 1
	awk -F= '
		BEGIN {
			expected["version"]=1; expected["phase"]=1
			expected["unit_state"]=1; expected["unit_sha256"]=1
			expected["activity_state"]=1; expected["activity_sha256"]=1
			expected["config_present"]=1; expected["config_sha256"]=1
			expected["service_enabled"]=1; expected["service_active"]=1
			expected["managed_script_sha256"]=1; expected["managed_rule_sha256"]=1
			expected["managed_launcher_sha256"]=1; expected["managed_unit_sha256"]=1
			expected["managed_activity_sha256"]=1; expected["managed_config_sha256"]=1
		}
		{
			separator=index($0, "="); key=substr($0, 1, separator - 1)
			if (separator < 2 || !(key in expected) || seen[key]++) bad=1
		}
		END {for (key in expected) if (seen[key] != 1) bad=1; exit bad}
	' "${_KBL_AUTO_MANIFEST}" || return 1
	[[ "$(_kbl_auto_manifest_value version)" == 1 ]] || return 1
	phase="$(_kbl_auto_manifest_value phase)"
	[[ "${phase}" == installing || "${phase}" == installed ]] || return 1
	for key in service_enabled service_active config_present; do
		[[ "$(_kbl_auto_manifest_value "${key}")" == 0 || "$(_kbl_auto_manifest_value "${key}")" == 1 ]] || return 1
	done
	for key in unit activity; do
		state="$(_kbl_auto_manifest_value "${key}_state")"
		sha="$(_kbl_auto_manifest_value "${key}_sha256")"
		[[ "${key}" == unit ]] && backup="${_KBL_BACKUP_UNIT}" || backup="${_KBL_BACKUP_ACTIVITY}"
		case "${state}" in
			absent) [[ "${sha}" == none && ! -e "${backup}" && ! -L "${backup}" ]] || return 1 ;;
			managed|foreign) _kbl_sha_matches "${backup}" "${sha}" || return 1 ;;
			*) return 1 ;;
		esac
	done
	present="$(_kbl_auto_manifest_value config_present)"
	if [[ "${present}" == 1 ]]; then
		_kbl_sha_matches "${_KBL_BACKUP_CONFIG}" "$(_kbl_auto_manifest_value config_sha256)" || return 1
	else
		[[ "$(_kbl_auto_manifest_value config_sha256)" == none &&
			! -e "${_KBL_BACKUP_CONFIG}" && ! -L "${_KBL_BACKUP_CONFIG}" ]] || return 1
	fi
	for key in managed_script_sha256 managed_rule_sha256 managed_launcher_sha256 \
		managed_unit_sha256 managed_activity_sha256 managed_config_sha256
	do
		sha="$(_kbl_auto_manifest_value "${key}")"
		if [[ "${phase}" == installing ]]; then
			[[ "${sha}" == pending || "${sha}" == none || "${sha}" =~ ^[0-9a-f]{64}$ ]] || return 1
		else
			[[ "${sha}" =~ ^[0-9a-f]{64}$ ]] || return 1
		fi
	done
}

_kbl_set_auto_manifest_value()
{
	local wanted="$1" value="$2" temporary="${_KBL_AUTO_MANIFEST}.tmp.$$"
	awk -F= -v wanted="${wanted}" -v value="${value}" '
		$1 == wanted {print wanted "=" value; next} {print}
	' "${_KBL_AUTO_MANIFEST}" > "${temporary}"
	chmod 600 -- "${temporary}"
	chown "${_KBL_STATE_OWNER_UID}:${_KBL_STATE_OWNER_GID}" -- "${temporary}"
	mv -f -- "${temporary}" "${_KBL_AUTO_MANIFEST}"
}

_kbl_capture_auto_manifest()
{
	local config unit_state activity_state unit_sha activity_sha config_present=0 config_sha=none
	local service_enabled=0 service_active=0 temporary launcher
	[[ ! -e "${_KBL_AUTO_MANIFEST}" && ! -L "${_KBL_AUTO_MANIFEST}" ]] || return 1
	config="$(_kbl_config_path)"
	launcher="${_KBL_TARGET_HOME}/.local/share/applications/net.local.kbd-backlight.desktop"
	unit_state="$(_kbl_file_state "${_KBL_UNIT_DEST}" "${_KBL_UNIT_SOURCE}")" || return 1
	activity_state="$(_kbl_file_state "${_KBL_ACTIVITY_DEST}" "${_KBL_ACTIVITY_SOURCE}")" || return 1
	unit_sha="$(_kbl_backup_file "${_KBL_UNIT_DEST}" "${_KBL_BACKUP_UNIT}")" || return 1
	activity_sha="$(_kbl_backup_file "${_KBL_ACTIVITY_DEST}" "${_KBL_BACKUP_ACTIVITY}")" || return 1
	if [[ -e "${config}" || -L "${config}" ]]; then
		[[ -f "${config}" && ! -L "${config}" && "$(stat -Lc '%u' -- "${config}")" == "${_KBL_TARGET_UID}" ]] || return 1
		config_present=1
		config_sha="$(_kbl_backup_file "${config}" "${_KBL_BACKUP_CONFIG}")" || return 1
	fi
	_kbl_as_user systemctl --user is-enabled zenbook-duo-kbd-backlight-activity.service >/dev/null 2>&1 && service_enabled=1
	_kbl_as_user systemctl --user is-active zenbook-duo-kbd-backlight-activity.service >/dev/null 2>&1 && service_active=1
	mkdir -p -- "${_KBL_RECORD_DIR}"
	temporary="${_KBL_AUTO_MANIFEST}.tmp.$$"
	{
		printf 'version=1\nphase=installing\n'
		printf 'unit_state=%s\nunit_sha256=%s\n' "${unit_state}" "${unit_sha}"
		printf 'activity_state=%s\nactivity_sha256=%s\n' "${activity_state}" "${activity_sha}"
		printf 'config_present=%s\nconfig_sha256=%s\n' "${config_present}" "${config_sha}"
		printf 'service_enabled=%s\nservice_active=%s\n' "${service_enabled}" "${service_active}"
		printf 'managed_script_sha256=%s\n' "$([[ -f "${_KBL_SCRIPT_DEST}" ]] && _kbl_sha256 "${_KBL_SCRIPT_DEST}" || echo none)"
		printf 'managed_rule_sha256=%s\n' "$([[ -f "${_KBL_RULE_DEST}" ]] && _kbl_sha256 "${_KBL_RULE_DEST}" || echo none)"
		printf 'managed_launcher_sha256=%s\n' "$([[ -f "${launcher}" ]] && _kbl_sha256 "${launcher}" || echo none)"
		printf 'managed_unit_sha256=pending\nmanaged_activity_sha256=pending\nmanaged_config_sha256=pending\n'
	} > "${temporary}"
	chmod 600 -- "${temporary}"
	chown "${_KBL_STATE_OWNER_UID}:${_KBL_STATE_OWNER_GID}" -- "${temporary}"
	mv -f -- "${temporary}" "${_KBL_AUTO_MANIFEST}"
	_kbl_auto_manifest_valid
}

_kbl_begin_reinstall_transaction()
{
	local launcher config state_file path key present state
	launcher="${_KBL_TARGET_HOME}/.local/share/applications/net.local.kbd-backlight.desktop"
	config="$(_kbl_config_path)"
	state_file="${_KBL_TARGET_HOME}/.local/state/zenbook-tweaks/kbd-backlight/state"
	[[ ! -e "${_KBL_TXN_DIR}" && ! -L "${_KBL_TXN_DIR}" ]] || return 1
	mkdir -p -- "${_KBL_TXN_DIR}/files"
	chmod 700 -- "${_KBL_TXN_DIR}" "${_KBL_TXN_DIR}/files"
	state="${_KBL_TXN_DIR}/state"
	: > "${state}"
	chmod 600 -- "${state}"
	for key in script rule launcher activity unit config user_state auto_manifest; do
		case "${key}" in
			script) path="${_KBL_SCRIPT_DEST}" ;;
			rule) path="${_KBL_RULE_DEST}" ;;
			launcher) path="${launcher}" ;;
			activity) path="${_KBL_ACTIVITY_DEST}" ;;
			unit) path="${_KBL_UNIT_DEST}" ;;
			config) path="${config}" ;;
			user_state) path="${state_file}" ;;
			auto_manifest) path="${_KBL_AUTO_MANIFEST}" ;;
		esac
		present=0
		if [[ -e "${path}" || -L "${path}" ]]; then
			[[ -f "${path}" && ! -L "${path}" ]] || return 1
			cp -a -- "${path}" "${_KBL_TXN_DIR}/files/${key}"
			present=1
		fi
		printf '%s_present=%s\n' "${key}" "${present}" >> "${state}"
	done
	_kbl_as_user systemctl --user is-enabled zenbook-duo-kbd-backlight-activity.service >/dev/null 2>&1 && present=1 || present=0
	printf 'service_enabled=%s\n' "${present}" >> "${state}"
	_kbl_as_user systemctl --user is-active zenbook-duo-kbd-backlight-activity.service >/dev/null 2>&1 && present=1 || present=0
	printf 'service_active=%s\n' "${present}" >> "${state}"
}

_kbl_restore_reinstall_transaction()
{
	local launcher config state_file path key present state="${_KBL_TXN_DIR}/state"
	[[ -f "${state}" && ! -L "${state}" ]] || return 1
	launcher="${_KBL_TARGET_HOME}/.local/share/applications/net.local.kbd-backlight.desktop"
	config="$(_kbl_config_path)"
	state_file="${_KBL_TARGET_HOME}/.local/state/zenbook-tweaks/kbd-backlight/state"
	_kbl_as_user systemctl --user disable --now zenbook-duo-kbd-backlight-activity.service >/dev/null 2>&1 || true
	for key in script rule launcher activity unit config user_state auto_manifest; do
		case "${key}" in
			script) path="${_KBL_SCRIPT_DEST}" ;;
			rule) path="${_KBL_RULE_DEST}" ;;
			launcher) path="${launcher}" ;;
			activity) path="${_KBL_ACTIVITY_DEST}" ;;
			unit) path="${_KBL_UNIT_DEST}" ;;
			config) path="${config}" ;;
			user_state) path="${state_file}" ;;
			auto_manifest) path="${_KBL_AUTO_MANIFEST}" ;;
		esac
		present="$(awk -F= -v key="${key}_present" '$1 == key {print $2}' "${state}")"
		if [[ "${present}" == 1 ]]; then
			mkdir -p -- "$(dirname -- "${path}")"
			cp -a -- "${_KBL_TXN_DIR}/files/${key}" "${path}"
		else
			rm -f -- "${path}"
		fi
	done
	_kbl_reload_udev >/dev/null 2>&1 || true
	_kbl_trigger_target_hidraw false >/dev/null 2>&1 || true
	_kbl_as_user systemctl --user daemon-reload || return 1
	if grep -qx 'service_enabled=1' "${state}"; then
		_kbl_as_user systemctl --user enable zenbook-duo-kbd-backlight-activity.service >/dev/null || return 1
	fi
	if grep -qx 'service_active=1' "${state}"; then
		_kbl_as_user systemctl --user start zenbook-duo-kbd-backlight-activity.service || return 1
	fi
}

_kbl_cleanup_reinstall_transaction()
{
	find "${_KBL_TXN_DIR}" -type f -delete 2>/dev/null || true
	find "${_KBL_TXN_DIR}" -depth -type d -empty -delete 2>/dev/null || true
}

_kbl_load_target()
{
	local entry account_uid account_gid account_home
	if _kbl_manifest_valid; then
		_KBL_TARGET_USER="$(_kbl_manifest_value user)"
		_KBL_TARGET_UID="$(_kbl_manifest_value uid)"
		_KBL_TARGET_GID="$(_kbl_manifest_value gid)"
		_KBL_TARGET_HOME="$(_kbl_decode "$(_kbl_manifest_value home_b64)")"
	else
		_KBL_TARGET_USER="${SUDO_USER:-}"
		[[ -n "${_KBL_TARGET_USER}" && "${_KBL_TARGET_USER}" != root ]] || return 1
	fi
	entry="$(getent passwd "${_KBL_TARGET_USER}")"
	[[ -n "${entry}" ]] || return 1
	IFS=: read -r _ _ account_uid account_gid _ account_home _ <<< "${entry}"
	if [[ -z "${_KBL_TARGET_UID}" ]]; then
		_KBL_TARGET_UID="${account_uid}"
		_KBL_TARGET_GID="${account_gid}"
		_KBL_TARGET_HOME="${account_home}"
	fi
	[[ -n "${_KBL_TARGET_HOME}" && -d "${_KBL_TARGET_HOME}" ]] || return 1
	[[ "${_KBL_TARGET_USER}" != root && "${_KBL_TARGET_UID}" != 0 ]] || return 1
	[[ "${account_uid}:${account_gid}:${account_home}" == \
		"${_KBL_TARGET_UID}:${_KBL_TARGET_GID}:${_KBL_TARGET_HOME}" ]] || return 1
}

_kbl_as_user()
{
	local runtime="/run/user/${_KBL_TARGET_UID}"
	if [[ "${EUID}" -eq 0 ]]; then
		runuser -u "${_KBL_TARGET_USER}" -- env HOME="${_KBL_TARGET_HOME}" \
			USER="${_KBL_TARGET_USER}" LOGNAME="${_KBL_TARGET_USER}" \
			XDG_RUNTIME_DIR="${runtime}" DBUS_SESSION_BUS_ADDRESS="unix:path=${runtime}/bus" "$@"
	else
		env HOME="${_KBL_TARGET_HOME}" XDG_RUNTIME_DIR="${runtime}" \
			DBUS_SESSION_BUS_ADDRESS="unix:path=${runtime}/bus" "$@"
	fi
}

_kbl_session_active()
{
	local runtime="/run/user/${_KBL_TARGET_UID}"
	local session session_uid active remote class type seat found=false
	[[ -d "${runtime}" && -S "${runtime}/bus" ]] || return 1
	while read -r session _; do
		[[ -n "${session}" ]] || continue
		session_uid="$(loginctl show-session "${session}" -p User --value 2>/dev/null || true)"
		[[ "${session_uid}" == "${_KBL_TARGET_UID}" ]] || continue
		active="$(loginctl show-session "${session}" -p Active --value 2>/dev/null || true)"
		remote="$(loginctl show-session "${session}" -p Remote --value 2>/dev/null || true)"
		class="$(loginctl show-session "${session}" -p Class --value 2>/dev/null || true)"
		type="$(loginctl show-session "${session}" -p Type --value 2>/dev/null || true)"
		seat="$(loginctl show-session "${session}" -p Seat --value 2>/dev/null || true)"
		if [[ "${active}" == yes && "${remote}" == no && "${class}" == user &&
			( "${type}" == wayland || "${type}" == x11 ) && -n "${seat}" ]]
		then
			found=true
			break
		fi
	done < <(loginctl list-sessions --no-legend 2>/dev/null)
	[[ "${found}" == true ]] || return 1
	_kbl_as_user gdbus call --session --dest org.kde.kglobalaccel --object-path /kglobalaccel \
		--method org.freedesktop.DBus.Peer.Ping >/dev/null 2>&1
}

_kbl_user_in_input()
{
	id -nG "${_KBL_TARGET_USER}" | tr ' ' '\n' | grep -qx input
}

_kbl_remove_input_membership()
{
	gpasswd -d "${_KBL_TARGET_USER}" input >/dev/null
}

_kbl_add_input_membership()
{
	gpasswd -a "${_KBL_TARGET_USER}" input >/dev/null
}

_kbl_shortcut_value()
{
	_kbl_as_user kreadconfig6 --file kglobalshortcutsrc --group services \
		--group net.local.kbd-backlight.desktop --key _launch --default '__KBL_ABSENT__'
}

_kbl_shortcut_keys()
{
	local output keys
	output="$(_kbl_as_user gdbus call --session --dest org.kde.kglobalaccel \
		--object-path /kglobalaccel --method org.kde.KGlobalAccel.shortcutKeys \
		"${_KBL_ACTION_ID}" 2>/dev/null)" || return 1
	keys="$(printf '%s\n' "${output}" | sed -E 's/^\((.*),\)$/\1/')"
	[[ "${keys}" != "${output}" ]] || return 1
	printf '%s' "${keys}" | python3 -c '
import ast, sys
raw = sys.stdin.read()
if raw.startswith("@a(ai) "):
    raw = raw[7:]
try:
    sequences = ast.literal_eval(raw)
except Exception:
    raise SystemExit(1)
valid = isinstance(sequences, list) and all(
    isinstance(sequence, tuple) and len(sequence) == 1
    and isinstance(sequence[0], list) and len(sequence[0]) == 4
    and all(isinstance(key, int) for key in sequence[0])
    for sequence in sequences
)
raise SystemExit(0 if valid else 1)
' || return 1
	printf '%s\n' "${keys}"
}

_kbl_shortcut_runtime_present()
{
	_kbl_as_user gdbus call --session --dest org.kde.kglobalaccel \
		--object-path /component/net_local_kbd_backlight_desktop \
		--method org.kde.kglobalaccel.Component.shortcutNames 2>/dev/null | grep -q "'_launch'"
}

_kbl_f4_available()
{
	local output
	output="$(_kbl_as_user gdbus call --session --dest org.kde.kglobalaccel \
		--object-path /kglobalaccel --method org.kde.KGlobalAccel.getGlobalShortcutsByKey \
		16777267 2>/dev/null)" || return 1
	[[ "${output}" == '(@a(ssssssaiai) [],)' ]] && return 0
	printf '%s' "${output}" | python3 -c '
import ast, sys
try:
    outer = ast.literal_eval(sys.stdin.read())
    rows = outer[0]
except Exception:
    raise SystemExit(1)
raise SystemExit(0 if all(row[2] == "net.local.kbd-backlight.desktop" for row in rows) else 1)
'
}

_kbl_set_shortcut_f4()
{
	_kbl_as_user gdbus call --session --dest org.kde.kglobalaccel --object-path /kglobalaccel \
		--method org.kde.KGlobalAccel.doRegister "${_KBL_ACTION_ID}" >/dev/null
	_kbl_as_user gdbus call --session --dest org.kde.kglobalaccel --object-path /kglobalaccel \
		--method org.kde.KGlobalAccel.setForeignShortcutKeys "${_KBL_ACTION_ID}" \
		'[([16777267,0,0,0],)]' >/dev/null
	[[ "$(_kbl_shortcut_value)" == F4 ]] || return 1
	_kbl_shortcut_keys | grep -q '16777267'
}

_kbl_restore_shortcut()
{
	local present value keys runtime_available=false
	present="$(_kbl_manifest_value shortcut_present)"
	_kbl_session_active && runtime_available=true
	if [[ "${present}" == 1 ]]; then
		value="$(_kbl_decode "$(_kbl_manifest_value shortcut_value_b64)")"
		if [[ "${runtime_available}" == true ]]; then
			if [[ "$(_kbl_manifest_value shortcut_runtime_present)" == 1 ]]; then
				keys="$(_kbl_decode "$(_kbl_manifest_value shortcut_keys_b64)")"
				_kbl_as_user gdbus call --session --dest org.kde.kglobalaccel \
					--object-path /kglobalaccel --method org.kde.KGlobalAccel.doRegister \
					"${_KBL_ACTION_ID}" >/dev/null || return 1
				_kbl_as_user gdbus call --session --dest org.kde.kglobalaccel \
					--object-path /kglobalaccel --method org.kde.KGlobalAccel.setForeignShortcutKeys \
					"${_KBL_ACTION_ID}" "${keys}" >/dev/null || return 1
			else
				_kbl_as_user gdbus call --session --dest org.kde.kglobalaccel \
					--object-path /kglobalaccel --method org.kde.KGlobalAccel.unregister \
					net.local.kbd-backlight.desktop _launch >/dev/null 2>&1 || true
			fi
		fi
		_kbl_as_user kwriteconfig6 --file kglobalshortcutsrc --group services \
			--group net.local.kbd-backlight.desktop --key _launch "${value}"
		[[ "$(_kbl_shortcut_value)" == "${value}" ]]
	else
		if [[ "${runtime_available}" == true ]]; then
			_kbl_as_user gdbus call --session --dest org.kde.kglobalaccel \
				--object-path /kglobalaccel --method org.kde.KGlobalAccel.unregister \
				net.local.kbd-backlight.desktop _launch >/dev/null 2>&1 || true
		fi
		_kbl_as_user kwriteconfig6 --file kglobalshortcutsrc --group services \
			--group net.local.kbd-backlight.desktop --key _launch --delete
		[[ "$(_kbl_shortcut_value)" == __KBL_ABSENT__ ]]
	fi
}

_kbl_file_state()
{
	local path="$1"
	local source="$2"
	local legacy_sha="${3:-}"
	local actual
	if [[ ! -e "${path}" && ! -L "${path}" ]]; then
		echo absent
		return 0
	fi
	[[ -f "${path}" && ! -L "${path}" ]] || return 1
	actual="$(_kbl_sha256 "${path}")"
	if cmp -s -- "${path}" "${source}" || [[ -n "${legacy_sha}" && "${actual}" == "${legacy_sha}" ]]; then
		echo managed
	else
		echo foreign
	fi
}

_kbl_backup_file()
{
	local source="$1"
	local backup="$2"
	if [[ ! -e "${source}" && ! -L "${source}" ]]; then
		printf 'none\n'
		return 0
	fi
	[[ -f "${source}" && ! -L "${source}" ]] || return 1
	mkdir -p -- "$(dirname -- "${backup}")"
	cp -a -- "${source}" "${backup}"
	cmp -s -- "${source}" "${backup}" || return 1
	_kbl_sha256 "${backup}"
}

_kbl_capture_manifest()
{
	local launcher="${_KBL_TARGET_HOME}/.local/share/applications/net.local.kbd-backlight.desktop"
	local private_state_dir="${_KBL_TARGET_HOME}/.local/state/zenbook-tweaks/kbd-backlight"
	local script_state rule_state legacy_rule_state shortcut_value shortcut_keys
	local launcher_present=0 launcher_sha=none shortcut_present=0 shortcut_value_b64=none
	local shortcut_runtime_present=0 shortcut_keys_b64=none input_member=0
	local legacy_tmp_present=0 legacy_tmp_level=none legacy_tmp_sha=none
	local script_sha rule_sha legacy_rule_sha temporary

	_KBL_CAPTURE_STARTED=false
	[[ ! -e "${_KBL_MANIFEST}" && ! -L "${_KBL_MANIFEST}" ]] || return 1
	[[ ! -e "${_KBL_BACKUP_ROOT}" && ! -L "${_KBL_BACKUP_ROOT}" ]] || {
		echo "  ERROR: Orphaned keyboard-backlight rollback data exists."
		return 1
	}
	[[ ! -e "${private_state_dir}" && ! -L "${private_state_dir}" ]] || {
		echo "  ERROR: Unmanaged private keyboard-backlight state already exists."
		return 1
	}
	_KBL_CAPTURE_STARTED=true

	script_state="$(_kbl_file_state "${_KBL_SCRIPT_DEST}" "${_KBL_SCRIPT_SOURCE}" "${_KBL_LEGACY_SCRIPT_SHA256}")" || return 1
	rule_state="$(_kbl_file_state "${_KBL_RULE_DEST}" "${_KBL_RULE_SOURCE}")" || return 1
	legacy_rule_state="$(_kbl_file_state "${_KBL_LEGACY_RULE}" "${_KBL_RULE_SOURCE}" "${_KBL_LEGACY_RULE_SHA256}")" || return 1
	script_sha="$(_kbl_backup_file "${_KBL_SCRIPT_DEST}" "${_KBL_BACKUP_SCRIPT}")" || return 1
	rule_sha="$(_kbl_backup_file "${_KBL_RULE_DEST}" "${_KBL_BACKUP_RULE}")" || return 1
	legacy_rule_sha="$(_kbl_backup_file "${_KBL_LEGACY_RULE}" "${_KBL_BACKUP_LEGACY_RULE}")" || return 1

	if [[ -e "${launcher}" || -L "${launcher}" ]]; then
		[[ -f "${launcher}" && ! -L "${launcher}" &&
			"$(stat -Lc '%u' -- "${launcher}")" == "${_KBL_TARGET_UID}" ]] || return 1
		launcher_present=1
		launcher_sha="$(_kbl_backup_file "${launcher}" "${_KBL_BACKUP_LAUNCHER}")" || return 1
	fi

	shortcut_value="$(_kbl_shortcut_value)" || return 1
	if [[ "${shortcut_value}" != __KBL_ABSENT__ ]]; then
		shortcut_present=1
		shortcut_value_b64="$(_kbl_encode "${shortcut_value}")"
	fi
	if _kbl_shortcut_runtime_present; then
		shortcut_runtime_present=1
		shortcut_keys="$(_kbl_shortcut_keys)" || return 1
		shortcut_keys_b64="$(_kbl_encode "${shortcut_keys}")"
	fi

	_kbl_user_in_input && input_member=1
	if [[ -e "${_KBL_LEGACY_TMP}" || -L "${_KBL_LEGACY_TMP}" ]]; then
		[[ -f "${_KBL_LEGACY_TMP}" && ! -L "${_KBL_LEGACY_TMP}" &&
			"$(stat -Lc '%u' -- "${_KBL_LEGACY_TMP}")" == "${_KBL_TARGET_UID}" ]] || return 1
		legacy_tmp_level="$(tr -d '[:space:]' < "${_KBL_LEGACY_TMP}")"
		[[ "${legacy_tmp_level}" =~ ^[0-3]$ ]] || return 1
		legacy_tmp_present=1
		legacy_tmp_sha="$(_kbl_backup_file "${_KBL_LEGACY_TMP}" "${_KBL_BACKUP_LEGACY_TMP}")" || return 1
	fi

	mkdir -p -- "${_KBL_RECORD_DIR}"
	chmod 700 -- "${_KBL_RECORD_DIR}"
	temporary="${_KBL_MANIFEST}.tmp.$$"
	{
		printf 'version=1\nphase=installing\n'
		printf 'user=%s\nuid=%s\ngid=%s\n' "${_KBL_TARGET_USER}" "${_KBL_TARGET_UID}" "${_KBL_TARGET_GID}"
		printf 'home_b64=%s\n' "$(_kbl_encode "${_KBL_TARGET_HOME}")"
		printf 'launcher_present=%s\nlauncher_sha256=%s\n' "${launcher_present}" "${launcher_sha}"
		printf 'shortcut_present=%s\nshortcut_value_b64=%s\n' "${shortcut_present}" "${shortcut_value_b64}"
		printf 'shortcut_runtime_present=%s\nshortcut_keys_b64=%s\n' "${shortcut_runtime_present}" "${shortcut_keys_b64}"
		printf 'input_member=%s\ninput_removed=0\n' "${input_member}"
		printf 'script_state=%s\nscript_sha256=%s\n' "${script_state}" "${script_sha}"
		printf 'rule_state=%s\nrule_sha256=%s\n' "${rule_state}" "${rule_sha}"
		printf 'legacy_rule_state=%s\nlegacy_rule_sha256=%s\n' "${legacy_rule_state}" "${legacy_rule_sha}"
		printf 'legacy_tmp_present=%s\nlegacy_tmp_level=%s\nlegacy_tmp_sha256=%s\n' \
			"${legacy_tmp_present}" "${legacy_tmp_level}" "${legacy_tmp_sha}"
	} > "${temporary}"
	chmod 600 -- "${temporary}"
	chown "${_KBL_STATE_OWNER_UID}:${_KBL_STATE_OWNER_GID}" -- "${temporary}"
	mv -f -- "${temporary}" "${_KBL_MANIFEST}"
	_kbl_manifest_valid
}

_kbl_restore_file_for_failed_install()
{
	local path="$1"
	local state="$2"
	local backup="$3"
	if [[ "${state}" == absent ]]; then
		rm -f -- "${path}"
		[[ ! -e "${path}" && ! -L "${path}" ]]
	else
		mkdir -p -- "$(dirname -- "${path}")"
		cp -a -- "${backup}" "${path}"
		cmp -s -- "${backup}" "${path}"
	fi
}

_kbl_restore_launcher()
{
	local launcher="${_KBL_TARGET_HOME}/.local/share/applications/net.local.kbd-backlight.desktop"
	if [[ "$(_kbl_manifest_value launcher_present)" == 1 ]]; then
		mkdir -p -- "$(dirname -- "${launcher}")"
		cp -a -- "${_KBL_BACKUP_LAUNCHER}" "${launcher}"
		_kbl_sha_matches "${launcher}" "$(_kbl_manifest_value launcher_sha256)" || return 1
	else
		if [[ -f "${launcher}" ]] && cmp -s -- "${launcher}" "${_KBL_LAUNCHER_SOURCE}"; then
			rm -f -- "${launcher}"
		elif [[ -e "${launcher}" || -L "${launcher}" ]]; then
			return 1
		fi
	fi
	_kbl_as_user update-desktop-database "${_KBL_TARGET_HOME}/.local/share/applications" >/dev/null 2>&1 || true
	_kbl_as_user kbuildsycoca6 --noincremental >/dev/null 2>&1 || true
}

_kbl_remove_user_cache()
{
	local state_dir="${_KBL_TARGET_HOME}/.local/state/zenbook-tweaks/kbd-backlight"
	local state_file="${state_dir}/state"
	if [[ -e "${state_file}" || -L "${state_file}" ]]; then
		[[ -f "${state_file}" && ! -L "${state_file}" &&
			"$(stat -Lc '%u' -- "${state_file}")" == "${_KBL_TARGET_UID}" ]] || return 1
		rm -f -- "${state_file}"
	fi
	rmdir -- "${state_dir}" 2>/dev/null || true
	rmdir -- "${_KBL_TARGET_HOME}/.local/state/zenbook-tweaks" 2>/dev/null || true
}

_kbl_restore_input_membership()
{
	if [[ "$(_kbl_manifest_value input_member)" == 1 && "$(_kbl_manifest_value input_removed)" == 1 ]]; then
		_kbl_user_in_input || _kbl_add_input_membership
	fi
}

_kbl_abort_install()
{
	local failed=0
	_kbl_manifest_valid || return 1
	_kbl_load_target || return 1
	if _kbl_auto_manifest_valid; then
		_kbl_stop_activity_service || failed=1
		_kbl_restore_automatic_for_uninstall || failed=1
	fi
	_kbl_restore_input_membership || failed=1
	_kbl_restore_launcher || failed=1
	_kbl_restore_shortcut || failed=1
	_kbl_remove_user_cache || failed=1
	_kbl_restore_file_for_failed_install "${_KBL_SCRIPT_DEST}" \
		"$(_kbl_manifest_value script_state)" "${_KBL_BACKUP_SCRIPT}" || failed=1
	_kbl_restore_file_for_failed_install "${_KBL_RULE_DEST}" \
		"$(_kbl_manifest_value rule_state)" "${_KBL_BACKUP_RULE}" || failed=1
	_kbl_restore_file_for_failed_install "${_KBL_LEGACY_RULE}" \
		"$(_kbl_manifest_value legacy_rule_state)" "${_KBL_BACKUP_LEGACY_RULE}" || failed=1
	if [[ "$(_kbl_manifest_value legacy_tmp_present)" == 1 ]]; then
		cp -a -- "${_KBL_BACKUP_LEGACY_TMP}" "${_KBL_LEGACY_TMP}" || failed=1
		cmp -s -- "${_KBL_BACKUP_LEGACY_TMP}" "${_KBL_LEGACY_TMP}" || failed=1
	fi
	_kbl_reload_udev >/dev/null 2>&1 || failed=1
	_kbl_trigger_target_hidraw false >/dev/null 2>&1 || failed=1
	[[ "${failed}" == 0 ]] || return 1
	rm -f -- "${_KBL_MANIFEST}" "${_KBL_AUTO_MANIFEST}"
	find "${_KBL_BACKUP_ROOT}" -type f -delete 2>/dev/null || true
	find "${_KBL_BACKUP_ROOT}" -depth -type d -empty -delete 2>/dev/null || true
	rmdir -- "${_KBL_RECORD_DIR}" 2>/dev/null || true
}

_kbl_discard_failed_capture()
{
	rm -f -- "${_KBL_MANIFEST}"
	find "${_KBL_BACKUP_ROOT}" -type f -delete 2>/dev/null || true
	find "${_KBL_BACKUP_ROOT}" -depth -type d -empty -delete 2>/dev/null || true
	rmdir -- "${_KBL_RECORD_DIR}" 2>/dev/null || true
}

_kbl_reload_udev()
{
	udevadm control --reload-rules
}

_kbl_target_udev_paths()
{
	local devdir raw driver hid_phys interface_path input target
	local -A seen_interfaces=()
	for devdir in /sys/bus/hid/devices/0003:0B05:1CD7.*; do
		[[ -d "${devdir}" ]] || continue
		driver="$(basename "$(readlink -f "${devdir}/driver" 2>/dev/null)" 2>/dev/null || true)"
		hid_phys="$(awk -F= '$1 == "HID_PHYS" {print $2}' "${devdir}/uevent" 2>/dev/null)"
		[[ "${driver}" == hid-generic && "${hid_phys}" == */input4 ]] || continue
		interface_path="$(dirname -- "$(readlink -f -- "${devdir}")")"
		if [[ -d "${interface_path}" && -z "${seen_interfaces[${interface_path}]:-}" ]]; then
			seen_interfaces["${interface_path}"]=1
			printf '%s\n' "${interface_path}"
		fi
		for raw in "${devdir}"/hidraw/hidraw*; do [[ -e "${raw}" ]] && printf '%s\n' "${raw}"; done
	done
	for devdir in /sys/bus/hid/devices/0005:0B05:1CD8.*; do
		[[ -d "${devdir}" ]] || continue
		driver="$(basename "$(readlink -f "${devdir}/driver" 2>/dev/null)" 2>/dev/null || true)"
		[[ "${driver}" == hid-generic ]] || continue
		for raw in "${devdir}"/hidraw/hidraw*; do [[ -e "${raw}" ]] && printf '%s\n' "${raw}"; done
	done
	for input in /sys/class/input/event*; do
		[[ -e "${input}" ]] || continue
		target="$(readlink -f -- "${input}/device" 2>/dev/null || true)"
		case "${target}" in
			*0003:0B05:1CD7.*|*0005:0B05:1CD8.*)
				if udevadm info --query=property --path="${input}" 2>/dev/null | \
					grep -Eq '^ID_INPUT_(KEYBOARD|TOUCHPAD)=1$'
				then
					printf '%s\n' "${input}"
				fi
				;;
		esac
	done
}

_kbl_apply_udev_access()
{
	_kbl_reload_udev || return 1
	_kbl_trigger_target_hidraw true
}

_kbl_trigger_target_hidraw()
{
	local require_found="${1:-false}"
	local path found=0
	while IFS= read -r path; do
		[[ -n "${path}" ]] || continue
		found=1
		udevadm trigger --action=change "${path}" || return 1
	done < <(_kbl_target_udev_paths)
	if [[ "${require_found}" == true && "${found}" != 1 ]]; then
		return 1
	fi
	udevadm settle || return 1
}

_kbl_reenumerate_target_devices()
{
	local path
	local paths=()
	while IFS= read -r path; do
		[[ -n "${path}" ]] && paths+=("${path}")
	done < <(_kbl_target_udev_paths)
	for path in "${paths[@]}"; do
		udevadm trigger --action=remove "${path}" || return 1
	done
	udevadm settle || return 1
	for path in "${paths[@]}"; do
		udevadm trigger --action=add "${path}" || return 1
	done
	udevadm settle
}

_kbl_revoke_managed_device_access()
{
	local path name node
	if [[ "$(_kbl_manifest_value rule_state)" == foreign ||
		"$(_kbl_manifest_value legacy_rule_state)" == foreign ]]
	then
		return 0
	fi
	while IFS= read -r path; do
		name="$(basename -- "${path}")"
		case "${name}" in
			hidraw*) node="/dev/${name}" ;;
			event*) node="/dev/input/${name}" ;;
			*) continue ;;
		esac
		[[ -c "${node}" ]] || continue
		setfacl -x "u:${_KBL_TARGET_USER}" -- "${node}" 2>/dev/null || true
		chown root:input -- "${node}" || return 1
		chmod 660 -- "${node}" || return 1
	done < <(_kbl_target_udev_paths)
}

_kbl_selected_node()
{
	local status node
	status="$(_kbl_as_user "${_KBL_SCRIPT_DEST}" status 2>/dev/null)" || return 1
	node="$(printf '%s\n' "${status}" | sed -n 's/^Selected interface: \(hidraw[0-9][0-9]*\);.*$/\1/p')"
	[[ "${node}" =~ ^hidraw[0-9]+$ ]] || return 1
	printf '/dev/%s\n' "${node}"
}

_kbl_verify_uaccess()
{
	local node acl identity
	node="$(_kbl_selected_node)" || {
		echo "  ERROR: The installed controller could not select the intended hidraw node."
		return 1
	}
	identity="$(stat -Lc '%u:%g:%a' -- "${node}" 2>/dev/null || true)"
	[[ "${identity}" == "0:0:660" ]] || {
		echo "  ERROR: ${node} has base identity ${identity:-unavailable}; expected root:root:0660 with an active-user ACL."
		return 1
	}
	acl="$(getfacl -cp -- "${node}")"
	printf '%s\n' "${acl}" | grep -qx "user:${_KBL_TARGET_USER}:rw-" || {
		echo "  ERROR: ${node} is missing the active-session uaccess ACL."
		return 1
	}
	printf '%s\n' "${acl}" | grep -qx 'mask::rw-' || {
		echo "  ERROR: ${node} has an ineffective uaccess ACL mask."
		return 1
	}
	if ! _kbl_as_user test -r "${node}" || ! _kbl_as_user test -w "${node}"; then
		echo "  ERROR: A fresh target-user process cannot read and write ${node}."
		return 1
	fi
}

_kbl_verify_activity_uaccess()
{
	local input target properties kind node acl status transport found_keyboard=0 found_touchpad=0
	status="$(_kbl_as_user "${_KBL_SCRIPT_DEST}" status 2>/dev/null)" || return 1
	case "${status}" in
		*"Connection: USB"*) transport=usb ;;
		*"Connection: Bluetooth"*) transport=bluetooth ;;
		*) return 1 ;;
	esac
	for input in /sys/class/input/event*; do
		[[ -e "${input}" ]] || continue
		target="$(readlink -f -- "${input}/device" 2>/dev/null || true)"
		case "${transport}:${target}" in
			usb:*0003:0B05:1CD7.*|bluetooth:*0005:0B05:1CD8.*) ;;
			*) continue ;;
		esac
		properties="$(udevadm info --query=property --path="${input}" 2>/dev/null || true)"
		if printf '%s\n' "${properties}" | grep -qx 'ID_INPUT_KEYBOARD=1'; then
			kind=keyboard
		elif printf '%s\n' "${properties}" | grep -qx 'ID_INPUT_TOUCHPAD=1'; then
			kind=touchpad
		else
			continue
		fi
		node="/dev/input/$(basename -- "${input}")"
		[[ "$(stat -Lc '%u:%g:%a' -- "${node}" 2>/dev/null)" == 0:0:660 ]] || return 1
		acl="$(getfacl -cp -- "${node}" 2>/dev/null)" || return 1
		printf '%s\n' "${acl}" | grep -qx "user:${_KBL_TARGET_USER}:rw-" || return 1
		printf '%s\n' "${acl}" | grep -qx 'mask::rw-' || return 1
		_kbl_as_user test -r "${node}" || return 1
		[[ "${kind}" == keyboard ]] && found_keyboard=1 || found_touchpad=1
	done
	[[ "${found_keyboard}:${found_touchpad}" == 1:1 ]]
}

_kbl_install_launcher()
{
	local launcher_dir="${_KBL_TARGET_HOME}/.local/share/applications"
	local launcher="${launcher_dir}/net.local.kbd-backlight.desktop"
	if [[ -e "${launcher_dir}" || -L "${launcher_dir}" ]]; then
		[[ -d "${launcher_dir}" && ! -L "${launcher_dir}" &&
			"$(stat -Lc '%u' -- "${launcher_dir}")" == "${_KBL_TARGET_UID}" ]] || return 1
	else
		install -d -m755 -o "${_KBL_TARGET_UID}" -g "${_KBL_TARGET_GID}" "${launcher_dir}"
	fi
	install -m644 -o "${_KBL_TARGET_UID}" -g "${_KBL_TARGET_GID}" \
		"${_KBL_LAUNCHER_SOURCE}" "${launcher}"
	_kbl_as_user update-desktop-database "${launcher_dir}" >/dev/null
	_kbl_as_user kbuildsycoca6 --noincremental >/dev/null
}

_kbl_import_legacy_cache()
{
	local level="$1"
	[[ "${level}" =~ ^[0-3]$ ]] || return 1
	_kbl_as_user env KBD_BACKLIGHT_SOURCE_ONLY=true bash -c \
		'source "$1"; write_cached_level "$2" legacy' bash "${_KBL_SCRIPT_DEST}" "${level}"
}

_kbl_install_auto_config()
{
	local config config_dir temporary
	config="$(_kbl_config_path)"
	config_dir="$(dirname -- "${config}")"
	if [[ -e "${config}" || -L "${config}" ]]; then
		[[ -f "${config}" && ! -L "${config}" &&
			"$(stat -Lc '%u:%g:%a' -- "${config}")" == "${_KBL_TARGET_UID}:${_KBL_TARGET_GID}:600" ]] || return 1
		_kbl_as_user env KBD_BACKLIGHT_SOURCE_ONLY=true bash -c \
			'source "$1"; CONFIG_FILE="$2"; load_config' bash "${_KBL_SCRIPT_DEST}" "${config}"
		return
	fi
	install -d -m700 -o "${_KBL_TARGET_UID}" -g "${_KBL_TARGET_GID}" "${config_dir}"
	temporary="${config}.tmp.$$"
	printf 'version=1\nenabled=1\nidle_timeout_seconds=900\n' > "${temporary}"
	chown "${_KBL_TARGET_UID}:${_KBL_TARGET_GID}" -- "${temporary}"
	chmod 600 -- "${temporary}"
	mv -f -- "${temporary}" "${config}"
}

_kbl_config_enabled()
{
	awk -F= '$1 == "enabled" {print $2}' "$(_kbl_config_path)"
}

_kbl_start_activity_service()
{
	local runtime status attempt
	_kbl_as_user systemctl --user daemon-reload || return 1
	if [[ "$(_kbl_config_enabled)" == 1 ]]; then
		if [[ "$(_kbl_auto_manifest_value phase)" == installing ]]; then
			runtime="/run/user/${_KBL_TARGET_UID}/zenbook-tweaks/kbd-backlight-session"
			_kbl_as_user rm -f -- "${runtime}"
		fi
		_kbl_as_user systemctl --user enable --now zenbook-duo-kbd-backlight-activity.service || return 1
		_kbl_as_user systemctl --user is-active --quiet zenbook-duo-kbd-backlight-activity.service || return 1
		if [[ "$(_kbl_auto_manifest_value phase)" == installing ]]; then
			for attempt in {1..50}; do
				status="$(_kbl_as_user "${_KBL_SCRIPT_DEST}" status 2>/dev/null || true)"
				if [[ "${status}" == *"Verified hardware level: Low (1)"* &&
					"${status}" == *"Preferred session level: Low (1); source=default"* ]]
				then
					return 0
				fi
				sleep 0.1
			done
			return 1
		fi
		return 0
	else
		_kbl_as_user systemctl --user disable --now zenbook-duo-kbd-backlight-activity.service >/dev/null 2>&1 || true
	fi
}

_kbl_record_managed_auto_hashes()
{
	local launcher config
	launcher="${_KBL_TARGET_HOME}/.local/share/applications/net.local.kbd-backlight.desktop"
	config="$(_kbl_config_path)"
	_kbl_set_auto_manifest_value managed_script_sha256 "$(_kbl_sha256 "${_KBL_SCRIPT_DEST}")"
	_kbl_set_auto_manifest_value managed_rule_sha256 "$(_kbl_sha256 "${_KBL_RULE_DEST}")"
	_kbl_set_auto_manifest_value managed_launcher_sha256 "$(_kbl_sha256 "${launcher}")"
	_kbl_set_auto_manifest_value managed_unit_sha256 "$(_kbl_sha256 "${_KBL_UNIT_DEST}")"
	_kbl_set_auto_manifest_value managed_activity_sha256 "$(_kbl_sha256 "${_KBL_ACTIVITY_DEST}")"
	_kbl_set_auto_manifest_value managed_config_sha256 "$(_kbl_sha256 "${config}")"
	_kbl_set_auto_manifest_value phase installed
	_kbl_auto_manifest_valid
}

_kbl_install_steps()
{
	local legacy_state
	install -Dm755 -o "${_KBL_SYSTEM_OWNER}" -g "${_KBL_SYSTEM_GROUP}" \
		"${_KBL_SCRIPT_SOURCE}" "${_KBL_SCRIPT_DEST}"
	install -Dm644 -o "${_KBL_SYSTEM_OWNER}" -g "${_KBL_SYSTEM_GROUP}" \
		"${_KBL_RULE_SOURCE}" "${_KBL_RULE_DEST}"
	install -Dm755 -o "${_KBL_SYSTEM_OWNER}" -g "${_KBL_SYSTEM_GROUP}" \
		"${_KBL_ACTIVITY_SOURCE}" "${_KBL_ACTIVITY_DEST}"
	install -Dm644 -o "${_KBL_SYSTEM_OWNER}" -g "${_KBL_SYSTEM_GROUP}" \
		"${_KBL_UNIT_SOURCE}" "${_KBL_UNIT_DEST}"
	_kbl_install_auto_config || return 1
	legacy_state="$(_kbl_manifest_value legacy_rule_state)"
	if [[ "${legacy_state}" != absent && ( -e "${_KBL_LEGACY_RULE}" || -L "${_KBL_LEGACY_RULE}" ) ]]; then
		_kbl_sha_matches "${_KBL_LEGACY_RULE}" "$(_kbl_manifest_value legacy_rule_sha256)" || return 1
		rm -f -- "${_KBL_LEGACY_RULE}"
	fi
	_kbl_apply_udev_access || return 1
	_kbl_install_launcher || return 1
	_kbl_set_shortcut_f4 || return 1
	_kbl_verify_uaccess || return 1
	_kbl_verify_activity_uaccess || return 1

	if [[ "$(_kbl_manifest_value legacy_tmp_present)" == 1 &&
		( -e "${_KBL_LEGACY_TMP}" || -L "${_KBL_LEGACY_TMP}" ) ]]
	then
		_kbl_import_legacy_cache "$(_kbl_manifest_value legacy_tmp_level)" || return 1
		_kbl_sha_matches "${_KBL_LEGACY_TMP}" "$(_kbl_manifest_value legacy_tmp_sha256)" || return 1
		rm -f -- "${_KBL_LEGACY_TMP}"
	fi

	if [[ "$(_kbl_manifest_value input_member)" == 1 ]]; then
		if _kbl_user_in_input; then
			_kbl_set_manifest_value input_removed 1
			_kbl_remove_input_membership || return 1
		fi
		_kbl_user_in_input && return 1
	fi
	_kbl_verify_uaccess || return 1
	_kbl_as_user env KBD_BACKLIGHT_SOURCE_ONLY=true bash -c \
		'source "$1"; prepare_lock; discover_device true; hid_operation probe >/dev/null' \
		bash "${_KBL_SCRIPT_DEST}" || return 1
	_kbl_start_activity_service || return 1
	_kbl_record_managed_auto_hashes || return 1
	_kbl_set_manifest_value phase installed
	_kbl_manifest_valid
}

_kbl_require_commands()
{
	local command_name
	local commands=(awk base64 basename chmod chown cmp cp desktop-file-validate dirname find flock gdbus getfacl getent gpasswd grep id install kbuildsycoca6 kreadconfig6 kwriteconfig6 loginctl mkdir mv python3 readlink rm rmdir runuser sed setfacl sha256sum stat systemctl tr udevadm update-desktop-database)
	for command_name in "${commands[@]}"; do
		command -v "${command_name}" >/dev/null 2>&1 || {
			echo "  ERROR: Required command is unavailable: ${command_name}"
			return 1
		}
	done
}

_kbl_managed_files_pristine()
{
	local launcher="${_KBL_TARGET_HOME}/.local/share/applications/net.local.kbd-backlight.desktop"
	local config
	[[ -f "${_KBL_SCRIPT_DEST}" && ! -L "${_KBL_SCRIPT_DEST}" &&
		-f "${_KBL_RULE_DEST}" && ! -L "${_KBL_RULE_DEST}" ]] || return 1
	[[ "$(stat -Lc '%u:%g:%a' -- "${_KBL_SCRIPT_DEST}")" == "${_KBL_SYSTEM_UID}:${_KBL_SYSTEM_GID}:755" ]] || return 1
	[[ "$(stat -Lc '%u:%g:%a' -- "${_KBL_RULE_DEST}")" == "${_KBL_SYSTEM_UID}:${_KBL_SYSTEM_GID}:644" ]] || return 1
	[[ -f "${launcher}" && ! -L "${launcher}" ]] || return 1
	[[ "$(stat -Lc '%u:%g:%a' -- "${launcher}")" == "${_KBL_TARGET_UID}:${_KBL_TARGET_GID}:644" ]] || return 1
	if _kbl_auto_manifest_valid && [[ "$(_kbl_auto_manifest_value phase)" == installed ]]; then
		config="$(_kbl_config_path)"
		_kbl_sha_matches "${_KBL_SCRIPT_DEST}" "$(_kbl_auto_manifest_value managed_script_sha256)" || return 1
		_kbl_sha_matches "${_KBL_RULE_DEST}" "$(_kbl_auto_manifest_value managed_rule_sha256)" || return 1
		_kbl_sha_matches "${launcher}" "$(_kbl_auto_manifest_value managed_launcher_sha256)" || return 1
		_kbl_sha_matches "${_KBL_UNIT_DEST}" "$(_kbl_auto_manifest_value managed_unit_sha256)" || return 1
		_kbl_sha_matches "${_KBL_ACTIVITY_DEST}" "$(_kbl_auto_manifest_value managed_activity_sha256)" || return 1
		_kbl_sha_matches "${config}" "$(_kbl_auto_manifest_value managed_config_sha256)" || return 1
	else
		if ! cmp -s -- "${_KBL_SCRIPT_SOURCE}" "${_KBL_SCRIPT_DEST}"; then
			_kbl_sha_matches "${_KBL_SCRIPT_DEST}" "${_KBL_PRIOR_MANAGED_SCRIPT_SHA256}" ||
				_kbl_sha_matches "${_KBL_SCRIPT_DEST}" "${_KBL_V213_MANAGED_SCRIPT_SHA256}" || return 1
		fi
		if ! cmp -s -- "${_KBL_RULE_SOURCE}" "${_KBL_RULE_DEST}"; then
			_kbl_sha_matches "${_KBL_RULE_DEST}" "${_KBL_V213_MANAGED_RULE_SHA256}" || return 1
		fi
		cmp -s -- "${_KBL_LAUNCHER_SOURCE}" "${launcher}" || return 1
	fi
	[[ "$(_kbl_shortcut_value)" == F4 ]] || return 1
	[[ ! -e "${_KBL_LEGACY_RULE}" && ! -L "${_KBL_LEGACY_RULE}" ]] || return 1
}

tweak_pre_install()
{
	_kbl_require_commands || return 1
	desktop-file-validate "${_KBL_LAUNCHER_SOURCE}" || return 1
	udevadm verify "${_KBL_RULE_SOURCE}" >/dev/null || return 1
	python3 -c 'compile(open(__import__("sys").argv[1], encoding="utf-8").read(), __import__("sys").argv[1], "exec")' \
		"${_KBL_ACTIVITY_SOURCE}" || return 1
	if [[ -e "${_KBL_MANIFEST}" || -L "${_KBL_MANIFEST}" ]]; then
		_kbl_manifest_valid || {
			echo "  ERROR: Keyboard-backlight rollback state is invalid."
			return 1
		}
	fi
	if [[ -e "${_KBL_AUTO_MANIFEST}" || -L "${_KBL_AUTO_MANIFEST}" ]]; then
		_kbl_auto_manifest_valid || {
			echo "  ERROR: Automatic-lighting rollback state is invalid."
			return 1
		}
	fi
	_kbl_load_target || {
		echo "  ERROR: Run the TUI with sudo from the Plasma user who will use this tweak."
		return 1
	}
	if [[ -n "${SUDO_USER:-}" && "${SUDO_USER}" != "${_KBL_TARGET_USER}" ]]; then
		echo "  ERROR: This installation belongs to a different Plasma user."
		return 1
	fi
	_kbl_session_active || {
		echo "  ERROR: The target user's active Plasma shortcut service is unavailable."
		return 1
	}
	_kbl_f4_available || {
		echo "  ERROR: F4 is already assigned to an unrelated KDE action."
		return 1
	}
	if ! _kbl_as_user env KBD_BACKLIGHT_SOURCE_ONLY=true bash -c \
		'source "$1"; prepare_lock; discover_device true; hid_operation probe >/dev/null' \
		bash "${_KBL_SCRIPT_SOURCE}"
	then
		KBD_BACKLIGHT_SOURCE_ONLY=true bash -c \
			'source "$1"; discover_device true; hid_operation probe >/dev/null' \
			bash "${_KBL_SCRIPT_SOURCE}" || {
			echo "  ERROR: Connect the supported keyboard and make its backlight interface available."
			return 1
		}
	fi
	if _kbl_manifest_valid && ! _kbl_managed_files_pristine; then
		echo "  ERROR: Managed keyboard-backlight files were modified; refusing to overwrite them."
		return 1
	fi
}

tweak_post_install()
{
	local reinstall=false auto_created=false
	[[ -e "${_KBL_MANIFEST}" || -L "${_KBL_MANIFEST}" ]] && reinstall=true
	if [[ "${reinstall}" == true ]]; then
		_kbl_begin_reinstall_transaction || {
			echo "  ERROR: Could not create a reinstall transaction snapshot."
			return 1
		}
	fi
	if [[ ! -e "${_KBL_MANIFEST}" && ! -L "${_KBL_MANIFEST}" ]]; then
		if ! _kbl_capture_manifest; then
			echo "  ERROR: Could not create verified rollback state."
			[[ "${_KBL_CAPTURE_STARTED}" == true ]] && _kbl_discard_failed_capture
			return 1
		fi
	fi
	if [[ ! -e "${_KBL_AUTO_MANIFEST}" && ! -L "${_KBL_AUTO_MANIFEST}" ]]; then
		if ! _kbl_capture_auto_manifest; then
			echo "  ERROR: Could not create automatic-lighting rollback state."
			[[ "${reinstall}" == false ]] && _kbl_abort_install
			[[ "${reinstall}" == true ]] && _kbl_cleanup_reinstall_transaction
			return 1
		fi
		auto_created=true
	fi
	if ! _kbl_install_steps; then
		if [[ "${reinstall}" == true ]]; then
			if _kbl_restore_reinstall_transaction; then
				echo "  ERROR: Keyboard-backlight reinstall failed; the prior managed installation was restored."
			else
				echo "  ERROR: Keyboard-backlight reinstall rollback needs manual review."
			fi
			if [[ "${auto_created}" == true ]]; then
				rm -f -- "${_KBL_AUTO_MANIFEST}" "${_KBL_BACKUP_UNIT}" "${_KBL_BACKUP_ACTIVITY}" "${_KBL_BACKUP_CONFIG}"
			fi
			_kbl_cleanup_reinstall_transaction
		else
			echo "  ERROR: Keyboard-backlight installation failed; restoring the previous state."
			_kbl_abort_install || echo "  ERROR: Automatic rollback needs manual review."
		fi
		return 1
	fi
	[[ "${reinstall}" == true ]] && _kbl_cleanup_reinstall_transaction
	echo "  Installed USB control and readback-verified Bluetooth control."
	echo "  Enabled Low-on-connect and 15-minute keyboard/touchpad idle management."
	echo "  Adopted the existing KDE launcher and registered Fn+F4 without duplicates."
	echo "  Replaced broad input-group access with active-session uaccess."
}

_kbl_restore_system_for_uninstall()
{
	local state
	state="$(_kbl_manifest_value script_state)"
	if [[ "${state}" == foreign ]]; then
		cp -a -- "${_KBL_BACKUP_SCRIPT}" "${_KBL_SCRIPT_DEST}"
		_kbl_sha_matches "${_KBL_SCRIPT_DEST}" "$(_kbl_manifest_value script_sha256)" || return 1
	else
		rm -f -- "${_KBL_SCRIPT_DEST}"
	fi
	state="$(_kbl_manifest_value rule_state)"
	if [[ "${state}" == foreign ]]; then
		cp -a -- "${_KBL_BACKUP_RULE}" "${_KBL_RULE_DEST}"
		_kbl_sha_matches "${_KBL_RULE_DEST}" "$(_kbl_manifest_value rule_sha256)" || return 1
	else
		rm -f -- "${_KBL_RULE_DEST}"
	fi
	state="$(_kbl_manifest_value legacy_rule_state)"
	if [[ "${state}" == foreign ]]; then
		mkdir -p -- "$(dirname -- "${_KBL_LEGACY_RULE}")"
		cp -a -- "${_KBL_BACKUP_LEGACY_RULE}" "${_KBL_LEGACY_RULE}"
		_kbl_sha_matches "${_KBL_LEGACY_RULE}" "$(_kbl_manifest_value legacy_rule_sha256)" || return 1
	else
		rm -f -- "${_KBL_LEGACY_RULE}"
	fi
}

_kbl_stop_activity_service()
{
	if [[ -x "${_KBL_SCRIPT_DEST}" ]]; then
		_kbl_as_user "${_KBL_SCRIPT_DEST}" _auto-resume >/dev/null 2>&1 || true
	fi
	_kbl_as_user systemctl --user disable --now zenbook-duo-kbd-backlight-activity.service >/dev/null 2>&1 || true
}

_kbl_restore_automatic_for_uninstall()
{
	local state config
	_kbl_auto_manifest_valid || return 1
	config="$(_kbl_config_path)"
	state="$(_kbl_auto_manifest_value unit_state)"
	if [[ "${state}" == absent ]]; then
		rm -f -- "${_KBL_UNIT_DEST}"
	else
		cp -a -- "${_KBL_BACKUP_UNIT}" "${_KBL_UNIT_DEST}"
		_kbl_sha_matches "${_KBL_UNIT_DEST}" "$(_kbl_auto_manifest_value unit_sha256)" || return 1
	fi
	state="$(_kbl_auto_manifest_value activity_state)"
	if [[ "${state}" == absent ]]; then
		rm -f -- "${_KBL_ACTIVITY_DEST}"
	else
		cp -a -- "${_KBL_BACKUP_ACTIVITY}" "${_KBL_ACTIVITY_DEST}"
		_kbl_sha_matches "${_KBL_ACTIVITY_DEST}" "$(_kbl_auto_manifest_value activity_sha256)" || return 1
	fi
	if [[ "$(_kbl_auto_manifest_value config_present)" == 1 ]]; then
		mkdir -p -- "$(dirname -- "${config}")"
		cp -a -- "${_KBL_BACKUP_CONFIG}" "${config}"
		_kbl_sha_matches "${config}" "$(_kbl_auto_manifest_value config_sha256)" || return 1
	else
		rm -f -- "${config}"
		rmdir -- "$(dirname -- "${config}")" 2>/dev/null || true
	fi
	_kbl_as_user systemctl --user daemon-reload || return 1
	if [[ "$(_kbl_auto_manifest_value service_enabled)" == 1 ]]; then
		_kbl_as_user systemctl --user enable zenbook-duo-kbd-backlight-activity.service >/dev/null || return 1
	else
		_kbl_as_user systemctl --user disable zenbook-duo-kbd-backlight-activity.service >/dev/null 2>&1 || true
	fi
	if [[ "$(_kbl_auto_manifest_value service_active)" == 1 ]]; then
		_kbl_as_user systemctl --user start zenbook-duo-kbd-backlight-activity.service || return 1
	fi
}

_kbl_cleanup_records()
{
	rm -f -- "${_KBL_MANIFEST}"
	find "${_KBL_BACKUP_ROOT}" -type f -delete 2>/dev/null || true
	find "${_KBL_BACKUP_ROOT}" -depth -type d -empty -delete 2>/dev/null || true
	rmdir -- "${_KBL_RECORD_DIR}" 2>/dev/null || true
}

tweak_pre_uninstall()
{
	_kbl_manifest_valid || {
		echo "  ERROR: Verified keyboard-backlight rollback state is missing or invalid."
		return 1
	}
	[[ "$(_kbl_manifest_value phase)" == installed ]] || {
		echo "  ERROR: Installation rollback state is incomplete; refusing Uninstall."
		return 1
	}
	_kbl_load_target || return 1
	if [[ -e "${_KBL_AUTO_MANIFEST}" || -L "${_KBL_AUTO_MANIFEST}" ]]; then
		_kbl_auto_manifest_valid || {
			echo "  ERROR: Automatic-lighting rollback state is missing or invalid."
			return 1
		}
	fi
	_kbl_managed_files_pristine || {
		echo "  ERROR: Managed files, launcher, or F4 shortcut changed; refusing destructive rollback."
		return 1
	}
	if _kbl_auto_manifest_valid; then
		_kbl_stop_activity_service || return 1
		_kbl_restore_automatic_for_uninstall || return 1
	fi
	_kbl_restore_input_membership || return 1
	_kbl_restore_launcher || return 1
	_kbl_restore_shortcut || return 1
	_kbl_remove_user_cache || return 1
	_kbl_restore_system_for_uninstall || return 1
	_kbl_reload_udev || return 1
	_kbl_reenumerate_target_devices || return 1
	_kbl_revoke_managed_device_access || return 1
	rm -f -- "${_KBL_AUTO_MANIFEST}" "${_KBL_BACKUP_UNIT}" "${_KBL_BACKUP_ACTIVITY}" "${_KBL_BACKUP_CONFIG}"
	_kbl_cleanup_records
}

tweak_post_uninstall()
{
	echo "  Removed keyboard-backlight and automatic activity integration."
	echo "  Restored the exact previous KDE launcher, shortcut, and input-group state."
}

tweak_status_check()
{
	local launcher status_output config enabled
	if [[ ! -e "${_KBL_SCRIPT_DEST}" && ! -e "${_KBL_RULE_DEST}" &&
		! -e "${_KBL_MANIFEST}" && ! -e "${_KBL_LEGACY_RULE}" ]]
	then
		echo "not installed"
		return
	fi
	if [[ ! -f "${_KBL_SCRIPT_DEST}" || ! -f "${_KBL_RULE_DEST}" || ! -f "${_KBL_MANIFEST}" ]]; then
		echo "partially installed"
		return
	fi
	if ! _kbl_manifest_valid || ! _kbl_load_target || ! _kbl_auto_manifest_valid; then
		echo "installed (modified)"
		return
	fi
	launcher="${_KBL_TARGET_HOME}/.local/share/applications/net.local.kbd-backlight.desktop"
	config="$(_kbl_config_path)"
	if ! cmp -s -- "${_KBL_SCRIPT_SOURCE}" "${_KBL_SCRIPT_DEST}" ||
		! cmp -s -- "${_KBL_RULE_SOURCE}" "${_KBL_RULE_DEST}" ||
		! cmp -s -- "${_KBL_LAUNCHER_SOURCE}" "${launcher}" ||
		! cmp -s -- "${_KBL_ACTIVITY_SOURCE}" "${_KBL_ACTIVITY_DEST}" ||
		! cmp -s -- "${_KBL_UNIT_SOURCE}" "${_KBL_UNIT_DEST}" ||
		! _kbl_sha_matches "${config}" "$(_kbl_auto_manifest_value managed_config_sha256)" ||
		[[ "$(stat -Lc '%u:%g:%a' -- "${_KBL_SCRIPT_DEST}" 2>/dev/null)" != "${_KBL_SYSTEM_UID}:${_KBL_SYSTEM_GID}:755" ]] ||
		[[ "$(stat -Lc '%u:%g:%a' -- "${_KBL_RULE_DEST}" 2>/dev/null)" != "${_KBL_SYSTEM_UID}:${_KBL_SYSTEM_GID}:644" ]] ||
		[[ "$(_kbl_manifest_value phase)" != installed ]] ||
		[[ -e "${_KBL_LEGACY_RULE}" || -L "${_KBL_LEGACY_RULE}" ]] ||
		[[ -e "${_KBL_LEGACY_TMP}" || -L "${_KBL_LEGACY_TMP}" ]] ||
		[[ "$(_kbl_shortcut_value 2>/dev/null || true)" != F4 ]]
	then
		echo "installed (modified)"
		return
	fi
	status_output="$(_kbl_as_user "${_KBL_SCRIPT_DEST}" status 2>/dev/null || true)"
	enabled="$(_kbl_config_enabled 2>/dev/null || true)"
	if [[ "${enabled}" == 1 ]]; then
		_kbl_as_user systemctl --user is-enabled --quiet zenbook-duo-kbd-backlight-activity.service >/dev/null 2>&1 || {
			echo "installed (modified)"
			return
		}
		_kbl_as_user systemctl --user is-active --quiet zenbook-duo-kbd-backlight-activity.service >/dev/null 2>&1 || {
			echo "installed (modified)"
			return
		}
		[[ "${status_output}" == *"Watcher selection consistent: yes"* ]] || {
			echo "installed (modified)"
			return
		}
	elif [[ "${enabled}" != 0 ]]; then
		echo "installed (modified)"
		return
	else
		if _kbl_as_user systemctl --user is-enabled --quiet zenbook-duo-kbd-backlight-activity.service >/dev/null 2>&1 ||
			_kbl_as_user systemctl --user is-active --quiet zenbook-duo-kbd-backlight-activity.service >/dev/null 2>&1
		then
			echo "installed (modified)"
			return
		fi
	fi
	if [[ "$(_kbl_manifest_value input_removed)" == 1 ]] &&
		_kbl_user_in_input
	then
		echo "installed (modified)"
		return
	fi
	if [[ "${status_output}" == *"Connection: connected, but"* ||
		"${status_output}" == *"writable=no"* ]]
	then
		echo "installed (modified)"
		return
	fi
	echo "installed"
}

kbd_backlight_action_status()
{
	local helper="${_KBL_SCRIPT_SOURCE}"
	_kbl_load_target || {
		echo "  Keyboard-backlight installation owner is unavailable."
		return 1
	}
	if [[ -x "${_KBL_SCRIPT_DEST}" ]] && cmp -s -- "${_KBL_SCRIPT_SOURCE}" "${_KBL_SCRIPT_DEST}"; then
		helper="${_KBL_SCRIPT_DEST}"
	fi
	_kbl_as_user "${helper}" status
	if _kbl_manifest_valid && _kbl_auto_manifest_valid; then
		echo "Rollback records: checksum-verified"
	else
		echo "Rollback records: missing or invalid"
	fi
	if [[ "$(_kbl_manifest_value input_removed 2>/dev/null || true)" == 1 ]]; then
		echo "Input-group dependency: removed and recorded for rollback"
	else
		echo "Input-group dependency: not added by this tweak"
	fi
}

kbd_backlight_action_configure()
{
	local config enabled seconds minutes choice new_enabled new_seconds custom runtime backup failed=0
	local menu_opts
	[[ "${EUID}" -eq 0 ]] || {
		echo "  ERROR: Run zenbook-tweaks with sudo to configure automatic lighting."
		return 1
	}
	_kbl_manifest_valid && _kbl_auto_manifest_valid && _kbl_load_target || {
		echo "  ERROR: Install or update the keyboard-backlight tweak first."
		return 1
	}
	_kbl_managed_files_pristine || {
		echo "  ERROR: Managed keyboard-backlight files were modified."
		return 1
	}
	config="$(_kbl_config_path)"
	enabled="$(awk -F= '$1 == "enabled" {print $2}' "${config}")"
	seconds="$(awk -F= '$1 == "idle_timeout_seconds" {print $2}' "${config}")"
	minutes=$((seconds / 60))
	menu_opts=(
		"$([[ "${enabled}" == 1 ]] && echo Disable || echo Enable) automatic lighting"
		"5 minutes"
		"10 minutes"
		"15 minutes"
		"30 minutes"
		"60 minutes"
		"Custom timeout"
	)
	choice="$(run_menu "Automatic lighting: $([[ "${enabled}" == 1 ]] && echo enabled || echo disabled), ${minutes} minutes" \
		"${menu_opts[@]}")" || return 0
	new_enabled="${enabled}"
	new_seconds="${seconds}"
	case "${choice}" in
		0) [[ "${enabled}" == 1 ]] && new_enabled=0 || new_enabled=1 ;;
		1) new_enabled=1; new_seconds=300 ;;
		2) new_enabled=1; new_seconds=600 ;;
		3) new_enabled=1; new_seconds=900 ;;
		4) new_enabled=1; new_seconds=1800 ;;
		5) new_enabled=1; new_seconds=3600 ;;
		6)
			echo "  Enter a whole number from 1 through 120 minutes:"
			read -r custom </dev/tty || custom=""
			[[ "${custom}" =~ ^[0-9]+$ ]] && (( custom >= 1 && custom <= 120 )) || {
				echo "  ERROR: Timeout must be a whole number from 1 through 120."
				return 1
			}
			new_enabled=1
			new_seconds=$((custom * 60))
			;;
		*) return 0 ;;
	esac
	backup="$(mktemp /tmp/zenbook-kbd-config.XXXXXX)"
	cp -a -- "${config}" "${backup}"
	if [[ "${enabled}" == 1 && "${new_enabled}" == 0 ]]; then
		_kbl_as_user "${_KBL_SCRIPT_DEST}" _auto-resume >/dev/null 2>&1 || true
	fi
	if ! _kbl_as_user "${_KBL_SCRIPT_DEST}" _configure "${new_enabled}" "${new_seconds}"; then
		rm -f -- "${backup}"
		return 1
	fi
	if [[ "${new_enabled}" == 1 ]]; then
		runtime="/run/user/${_KBL_TARGET_UID}/zenbook-tweaks/kbd-backlight-session"
		if [[ "${enabled}" == 0 ]]; then
			_kbl_as_user rm -f -- "${runtime}"
		fi
		_kbl_as_user systemctl --user daemon-reload || failed=1
		_kbl_as_user systemctl --user enable zenbook-duo-kbd-backlight-activity.service >/dev/null || failed=1
		if [[ "${enabled}:${seconds}" == "1:${new_seconds}" ]]; then
			_kbl_as_user systemctl --user start zenbook-duo-kbd-backlight-activity.service || failed=1
		else
			_kbl_as_user systemctl --user restart zenbook-duo-kbd-backlight-activity.service || failed=1
		fi
	else
		_kbl_as_user systemctl --user disable --now zenbook-duo-kbd-backlight-activity.service >/dev/null 2>&1 || true
	fi
	if [[ "${failed}" == 1 ]]; then
		cp -a -- "${backup}" "${config}"
		_kbl_as_user systemctl --user daemon-reload >/dev/null 2>&1 || true
		if [[ "${enabled}" == 1 ]]; then
			_kbl_as_user systemctl --user enable --now zenbook-duo-kbd-backlight-activity.service >/dev/null 2>&1 || true
		else
			_kbl_as_user systemctl --user disable --now zenbook-duo-kbd-backlight-activity.service >/dev/null 2>&1 || true
		fi
		rm -f -- "${backup}"
		echo "  ERROR: Automatic-lighting service update failed; the previous setting was restored."
		return 1
	fi
	rm -f -- "${backup}"
	_kbl_set_auto_manifest_value managed_config_sha256 "$(_kbl_sha256 "${config}")"
	echo "  Automatic lighting: $([[ "${new_enabled}" == 1 ]] && echo enabled || echo disabled)"
	echo "  Inactivity timeout: $((new_seconds / 60)) minute(s)"
}
