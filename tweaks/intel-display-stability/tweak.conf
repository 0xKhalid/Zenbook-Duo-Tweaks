# Tweak: intel-display-stability
# Work around Intel xe Panel Replay display corruption and freezes

TWEAK_NAME="intel-display-stability"
TWEAK_DESCRIPTION="Prevent Intel screen corruption and freezes"
TWEAK_SUMMARY="Applies the proven Intel display stability workaround.
It covers every installed kernel and future Fedora kernels."

TWEAK_INFO="Works around cursor-following row corruption, transient flashing,
and display freezes caused by the Intel xe Panel Replay path.

Managed kernel arguments:
  xe.enable_psr2_sel_fetch=0
  xe.enable_panel_replay=0

Installation applies both arguments to every installed boot entry
and /etc/kernel/cmdline, so future Fedora kernels inherit them.
Reinstallation adopts matching arguments that were added manually.
Uninstallation removes only these two arguments.

The workaround disables Panel Replay and PSR2 selective fetch.
The driver can still use PSR1. The tradeoff is potentially higher
idle display power use, especially with both high-refresh panels on.

It does not change resolution, refresh rate, color, touch input,
GPU acceleration, screenshots, suspend, or hibernation behavior.

A reboot is required after install or uninstall. This tweak never
reboots automatically. Use Display stability status to compare the
persistent boot configuration with the currently running kernel."

# Boot-argument-only tweak — no files to install.
TWEAK_FILES=()

TWEAK_ACTIONS=(
	"Display stability status:tweak_action_display_stability_status"
)

_IDS_ARGS=(
	"xe.enable_psr2_sel_fetch=0"
	"xe.enable_panel_replay=0"
)
_IDS_STATE_FILE="${STATE_DIR}/intel-display-stability.managed"
_IDS_KERNEL_CMDLINE_FILE="${INTEL_DISPLAY_STABILITY_KERNEL_CMDLINE_FILE:-/etc/kernel/cmdline}"
_IDS_PROC_CMDLINE_FILE="${INTEL_DISPLAY_STABILITY_PROC_CMDLINE_FILE:-/proc/cmdline}"
_IDS_GRUBBY="${INTEL_DISPLAY_STABILITY_GRUBBY:-grubby}"
_IDS_XE_DRIVER_PATH="${INTEL_DISPLAY_STABILITY_XE_DRIVER_PATH:-/sys/bus/pci/drivers/xe}"

_ids_argument_count()
{
	local text="$1"
	local wanted="$2"
	local word
	local words=()
	local count=0

	read -ra words <<< "${text}"
	for word in "${words[@]}"; do
		if [[ "${word}" == "${wanted}" ]]; then
			count=$((count + 1))
		fi
	done
	printf '%s\n' "${count}"
}

_ids_argument_state()
{
	local text="$1"
	local first_count second_count

	first_count="$(_ids_argument_count "${text}" "${_IDS_ARGS[0]}")"
	second_count="$(_ids_argument_count "${text}" "${_IDS_ARGS[1]}")"

	if [[ "${first_count}" -eq 1 && "${second_count}" -eq 1 ]]; then
		echo enabled
	elif [[ "${first_count}" -eq 0 && "${second_count}" -eq 0 ]]; then
		echo disabled
	else
		echo partial
	fi
}

_ids_template_state()
{
	local cmdline

	if [[ ! -r "${_IDS_KERNEL_CMDLINE_FILE}" ]]; then
		echo unavailable
		return
	fi
	cmdline="$(<"${_IDS_KERNEL_CMDLINE_FILE}")"
	_ids_argument_state "${cmdline}"
}

_ids_entry_counts()
{
	local info line args state
	local total=0
	local enabled=0
	local disabled=0
	local partial=0

	if ! info="$("${_IDS_GRUBBY}" --info=ALL 2>/dev/null)"; then
		return 1
	fi

	while IFS= read -r line; do
		[[ "${line}" == args=* ]] || continue
		args="${line#args=}"
		args="${args#\"}"
		args="${args%\"}"
		state="$(_ids_argument_state "${args}")"
		total=$((total + 1))
		case "${state}" in
			enabled) enabled=$((enabled + 1)) ;;
			disabled) disabled=$((disabled + 1)) ;;
			*) partial=$((partial + 1)) ;;
		esac
	done <<< "${info}"

	[[ "${total}" -gt 0 ]] || return 1
	printf '%s %s %s %s\n' "${total}" "${enabled}" "${disabled}" "${partial}"
}

_ids_entries_state()
{
	local counts total enabled disabled partial

	if ! counts="$(_ids_entry_counts)"; then
		echo unavailable
		return
	fi
	read -r total enabled disabled partial <<< "${counts}"
	if [[ "${enabled}" -eq "${total}" ]]; then
		echo enabled
	elif [[ "${disabled}" -eq "${total}" ]]; then
		echo disabled
	else
		echo partial
	fi
}

_ids_persistent_state()
{
	local template_state entries_state

	template_state="$(_ids_template_state)"
	entries_state="$(_ids_entries_state)"
	if [[ "${template_state}" == enabled && "${entries_state}" == enabled ]]; then
		echo enabled
	elif [[ "${template_state}" == disabled && "${entries_state}" == disabled ]]; then
		echo disabled
	else
		echo partial
	fi
}

_ids_running_state()
{
	local cmdline

	if [[ ! -r "${_IDS_PROC_CMDLINE_FILE}" ]]; then
		echo unavailable
		return
	fi
	cmdline="$(<"${_IDS_PROC_CMDLINE_FILE}")"
	_ids_argument_state "${cmdline}"
}

_ids_state_label()
{
	case "$1" in
		enabled) echo "Enabled" ;;
		disabled) echo "Disabled" ;;
		partial) echo "Incomplete" ;;
		*) echo "Unavailable" ;;
	esac
}

tweak_status_check()
{
	case "$(_ids_persistent_state)" in
		enabled)
			if [[ -f "${_IDS_STATE_FILE}" ]]; then
				echo "installed"
			else
				echo "installed (modified)"
			fi
			;;
		disabled) echo "not installed" ;;
		*) echo "partially installed" ;;
	esac
}

tweak_action_display_stability_status()
{
	local template_state entries_state running_state persistent_state counts
	local total enabled disabled partial

	template_state="$(_ids_template_state)"
	entries_state="$(_ids_entries_state)"
	running_state="$(_ids_running_state)"
	persistent_state="$(_ids_persistent_state)"

	echo "  Running kernel:  $(uname -r)"
	echo "  Future kernels:  $(_ids_state_label "${template_state}")"
	if counts="$(_ids_entry_counts)"; then
		read -r total enabled disabled partial <<< "${counts}"
		echo "  Boot entries:    $(_ids_state_label "${entries_state}") (${enabled}/${total} enabled)"
	else
		echo "  Boot entries:    Unavailable"
	fi
	echo "  Running settings: $(_ids_state_label "${running_state}")"
	echo ""

	if [[ "${persistent_state}" == enabled && "${running_state}" != enabled ]]; then
		echo "  Reboot required: yes — enable the workaround in the running kernel."
	elif [[ "${persistent_state}" == disabled && "${running_state}" != disabled ]]; then
		echo "  Reboot required: yes — remove the workaround from the running kernel."
	elif [[ "${persistent_state}" == partial ]]; then
		echo "  Configuration is incomplete. Reinstall or uninstall the tweak to repair it."
	else
		echo "  Reboot required: no — persistent and running settings match."
	fi
}

tweak_pre_install()
{
	if ! command -v "${_IDS_GRUBBY}" &>/dev/null; then
		echo "  ERROR: grubby is required to manage Fedora kernel arguments."
		return 1
	fi
	if [[ ! -d "${_IDS_XE_DRIVER_PATH}" ]]; then
		echo "  ERROR: The Intel xe graphics driver is not available on this system."
		return 1
	fi

	echo "  Applying Intel display stability settings to all kernels..."
	# Normalize first so reinstalling also repairs duplicates and partial state.
	if ! "${_IDS_GRUBBY}" --update-kernel=ALL --remove-args="${_IDS_ARGS[*]}" >/dev/null 2>&1; then
		echo "  ERROR: Failed to normalize existing kernel arguments."
		return 1
	fi
	if ! "${_IDS_GRUBBY}" --update-kernel=ALL --args="${_IDS_ARGS[*]}" >/dev/null 2>&1; then
		echo "  ERROR: Failed to add the display stability arguments."
		return 1
	fi
	if [[ "$(_ids_persistent_state)" != enabled ]]; then
		echo "  ERROR: Kernel argument verification failed."
		return 1
	fi

	mkdir -p "${STATE_DIR}"
	printf '%s\n' "managed=1" > "${_IDS_STATE_FILE}"
	chmod 644 "${_IDS_STATE_FILE}"
	echo "  Workaround configured for all installed and future kernels."
	echo "  Reboot when convenient to activate it in the running kernel."
}

tweak_pre_uninstall()
{
	if ! command -v "${_IDS_GRUBBY}" &>/dev/null; then
		echo "  ERROR: grubby is required to remove the kernel arguments."
		return 1
	fi

	echo "  Removing Intel display stability settings from all kernels..."
	if ! "${_IDS_GRUBBY}" --update-kernel=ALL --remove-args="${_IDS_ARGS[*]}" >/dev/null 2>&1; then
		echo "  ERROR: Failed to remove the display stability arguments."
		return 1
	fi
	if [[ "$(_ids_persistent_state)" != disabled ]]; then
		echo "  ERROR: Kernel argument removal verification failed."
		return 1
	fi

	rm -f "${_IDS_STATE_FILE}"
	echo "  Workaround removed from all installed and future kernels."
	echo "  Reboot when convenient to remove it from the running kernel."
}
