# Tweak: whisper-dictate
# Live on-device voice-to-text transcription via local whisper.cpp

TWEAK_NAME="whisper-dictate"
TWEAK_DESCRIPTION="Live on-device voice-to-text transcription"

TWEAK_INFO="Live on-device voice-to-text transcription.
Press once to start recording, press again to stop, transcribe,
and auto-paste at cursor position. Fully local — no cloud APIs.
Non-speech token suppression is enabled when supported by your whisper.cpp build.
Recording auto-stops after 5 minutes by default.
Configurable via env var: WHISPER_MAX_RECORD_SECONDS (default: 300).
When the limit is reached, it auto-transcribes and pastes what was recorded.

Audio feedback plays a short sound on record start/stop.
Disable with: WHISPER_SOUND=0
Custom sounds: WHISPER_SOUND_START=/path/to/start.oga
               WHISPER_SOUND_STOP=/path/to/stop.oga

Uses whisper.cpp for transcription with a local model picker:
  Fast           base.en               142 MiB
  Better         small.en              466 MiB
  Strong         medium.en             1.5 GiB
  Best practical large-v3-turbo-q5_0   547 MiB

Model files download only when selected and are reused afterward.
Selection is stored in:
  ~/.config/zenbook-tweaks/whisper-dictate.conf

Runtime files stay local:
  ~/.local/share/whisper.cpp
  ~/.local/share/whisper.cpp/models

Silero VAD is validated and repaired as needed when supported
by your whisper.cpp build.

Dependencies installed automatically:
  alsa-utils, ydotool, wl-clipboard, libnotify,
  cmake, gcc-c++, git, curl, SDL2-devel

Key binding is up to you.
Example setup:
  Use input-remapper to map the Copilot key to F12,
  then bind F12 in KDE:
  1. Install input-remapper (dnf install input-remapper)
  2. Remap Copilot key → F12 (or pick any other key)
  3. System Settings → Shortcuts → Add New → Command/Script
     Command: whisper-dictate-toggle
     Trigger: your chosen key (F12 in the example)

ydotoold must be running (enabled automatically on install)."

# Files: "source_filename:dest_absolute_path:permissions"
TWEAK_FILES=(
	"whisper-dictate-toggle:/usr/local/bin/whisper-dictate-toggle:755"
)

TWEAK_ACTIONS=(
	"Change model:whisper_dictate_action_change_model"
)

WHISPER_DICTATE_CONFIG_MARKER="# Managed by Zenbook-Duo-Tweaks whisper-dictate"
WHISPER_DICTATE_CONFIG_RELATIVE=".config/zenbook-tweaks/whisper-dictate.conf"
WHISPER_DICTATE_MODEL_BASE_URL="https://huggingface.co/ggerganov/whisper.cpp/resolve/main"
WHISPER_DICTATE_VAD_MODEL_FILE="ggml-silero-v6.2.0.bin"
WHISPER_DICTATE_VAD_MODEL_URL="https://huggingface.co/ggml-org/whisper-vad/resolve/main/${WHISPER_DICTATE_VAD_MODEL_FILE}"
WHISPER_DICTATE_VAD_MIN_BYTES=800000

_WHISPER_MODEL_LABELS=("Fast" "Better" "Strong" "Best practical")
_WHISPER_MODEL_NAMES=("base.en" "small.en" "medium.en" "large-v3-turbo-q5_0")
_WHISPER_MODEL_SIZES=("142 MiB" "466 MiB" "1.5 GiB" "547 MiB")
_WHISPER_MODEL_NOTES=(
	"quickest"
	"better accuracy"
	"stronger accuracy"
	"best balance"
)

whisper_dictate_model_index()
{
	local model_name="$1"
	local i

	for i in "${!_WHISPER_MODEL_NAMES[@]}"; do
		if [[ "${_WHISPER_MODEL_NAMES[$i]}" == "$model_name" ]]; then
			echo "$i"
			return 0
		fi
	done

	return 1
}

whisper_dictate_model_file()
{
	local model_name="$1"
	echo "ggml-${model_name}.bin"
}

whisper_dictate_config_file()
{
	local target_home="$1"
	echo "${target_home}/${WHISPER_DICTATE_CONFIG_RELATIVE}"
}

whisper_dictate_read_config_model()
{
	local target_home="$1"
	local config_file
	config_file="$(whisper_dictate_config_file "$target_home")"

	[[ -f "$config_file" ]] || return 1

	local line
	while IFS= read -r line; do
		case "$line" in
			WHISPER_MODEL_NAME=*)
				echo "${line#WHISPER_MODEL_NAME=}"
				return 0
				;;
		esac
	done < "$config_file"

	return 1
}

whisper_dictate_current_model()
{
	local target_home="$1"
	local model_name
	model_name="$(whisper_dictate_read_config_model "$target_home" 2>/dev/null || true)"

	if [[ -z "$model_name" ]] || ! whisper_dictate_model_index "$model_name" >/dev/null; then
		model_name="base.en"
	fi

	echo "$model_name"
}

whisper_dictate_write_config()
{
	local target_user="$1"
	local target_home="$2"
	local model_name="$3"
	local config_file config_dir target_group

	config_file="$(whisper_dictate_config_file "$target_home")"
	config_dir="$(dirname "$config_file")"
	target_group="$(id -gn "$target_user")"

	mkdir -p "$config_dir"
	{
		echo "$WHISPER_DICTATE_CONFIG_MARKER"
		echo "# Local whisper.cpp model selected by Zenbook-Duo-Tweaks."
		echo "# Override at runtime with WHISPER_MODEL_NAME or WHISPER_MODEL_PATH."
		echo "WHISPER_MODEL_NAME=${model_name}"
	} > "$config_file"
	chown "$target_user:$target_group" "$config_file"
	chmod 644 "$config_file"
}

whisper_dictate_file_size()
{
	local path="$1"
	stat -c '%s' "$path" 2>/dev/null || echo 0
}

whisper_dictate_vad_model_path()
{
	local target_home="$1"
	echo "${target_home}/.local/share/whisper.cpp/models/${WHISPER_DICTATE_VAD_MODEL_FILE}"
}

whisper_dictate_vad_model_valid()
{
	local vad_model="$1"
	local vad_size

	[[ -f "$vad_model" ]] || return 1
	vad_size="$(whisper_dictate_file_size "$vad_model")"
	[[ "$vad_size" =~ ^[0-9]+$ ]] || return 1
	(( vad_size >= WHISPER_DICTATE_VAD_MIN_BYTES ))
}

whisper_dictate_ensure_vad_model()
{
	local target_user="$1"
	local target_home="$2"
	local vad_model vad_dir partial_path

	vad_model="$(whisper_dictate_vad_model_path "$target_home")"
	vad_dir="$(dirname "$vad_model")"
	partial_path="${vad_model}.partial"

	sudo -u "$target_user" mkdir -p "$vad_dir"

	if whisper_dictate_vad_model_valid "$vad_model"; then
		echo "  Silero VAD model already present: ${WHISPER_DICTATE_VAD_MODEL_FILE}"
		return 0
	fi

	if [[ -f "$vad_model" ]]; then
		echo "  Existing Silero VAD model is invalid; replacing it."
		sudo -u "$target_user" rm -f "$vad_model"
	fi

	echo "  Downloading Silero VAD model..."
	echo "  ${WHISPER_DICTATE_VAD_MODEL_URL}"
	sudo -u "$target_user" rm -f "$partial_path"

	if sudo -u "$target_user" curl -L --fail --progress-bar -o "$partial_path" "$WHISPER_DICTATE_VAD_MODEL_URL"; then
		if whisper_dictate_vad_model_valid "$partial_path"; then
			sudo -u "$target_user" mv "$partial_path" "$vad_model"
			echo "  Downloaded ${WHISPER_DICTATE_VAD_MODEL_FILE}"
		else
			sudo -u "$target_user" rm -f "$partial_path"
			echo "  ERROR: Downloaded Silero VAD model is too small or invalid."
			return 1
		fi
	else
		sudo -u "$target_user" rm -f "$partial_path"
		echo "  ERROR: Failed to download Silero VAD model."
		return 1
	fi
}

whisper_dictate_download_model()
{
	local target_user="$1"
	local target_home="$2"
	local model_name="$3"
	local model_index model_file model_url whisper_dir models_dir model_path partial_path

	model_index="$(whisper_dictate_model_index "$model_name")" || {
		echo "  ERROR: Unknown model: ${model_name}"
		return 1
	}

	model_file="$(whisper_dictate_model_file "$model_name")"
	model_url="${WHISPER_DICTATE_MODEL_BASE_URL}/${model_file}"
	whisper_dir="${target_home}/.local/share/whisper.cpp"
	models_dir="${whisper_dir}/models"
	model_path="${models_dir}/${model_file}"
	partial_path="${model_path}.partial"

	sudo -u "$target_user" mkdir -p "$models_dir"

	if [[ -f "$model_path" ]]; then
		echo "  ${_WHISPER_MODEL_LABELS[$model_index]} model already downloaded: ${model_file}"
		return 0
	fi

	echo "  Downloading ${_WHISPER_MODEL_LABELS[$model_index]} model (${model_name}, ${_WHISPER_MODEL_SIZES[$model_index]})..."
	echo "  ${model_url}"
	sudo -u "$target_user" rm -f "$partial_path"

	if sudo -u "$target_user" curl -L --fail --progress-bar -o "$partial_path" "$model_url"; then
		sudo -u "$target_user" mv "$partial_path" "$model_path"
		echo "  Downloaded ${model_file}"
	else
		sudo -u "$target_user" rm -f "$partial_path"
		echo "  ERROR: Failed to download ${model_name}."
		return 1
	fi
}

whisper_dictate_select_model()
{
	local target_user="$1"
	local target_home="$2"
	local cancel_mode="${3:-default}"
	local whisper_dir models_dir current_model menu_opts choice selected_model

	whisper_dir="${target_home}/.local/share/whisper.cpp"
	models_dir="${whisper_dir}/models"
	current_model="$(whisper_dictate_current_model "$target_home")"
	menu_opts=()

	local i
	for i in "${!_WHISPER_MODEL_NAMES[@]}"; do
		local model_name model_file model_state current_suffix
		model_name="${_WHISPER_MODEL_NAMES[$i]}"
		model_file="$(whisper_dictate_model_file "$model_name")"
		model_state="not downloaded"
		current_suffix=""

		if [[ -f "${models_dir}/${model_file}" ]]; then
			model_state="downloaded"
		fi

		if [[ "$model_name" == "$current_model" ]]; then
			current_suffix=", current"
		fi

		menu_opts+=("${_WHISPER_MODEL_LABELS[$i]} — ${model_name} (${_WHISPER_MODEL_SIZES[$i]}) - ${_WHISPER_MODEL_NOTES[$i]} [${model_state}${current_suffix}]")
	done

	menu_opts+=("Keep current (${current_model})")

	if choice=$(run_menu "Whisper Dictate Model" "${menu_opts[@]}"); then
		if [[ $choice -lt ${#_WHISPER_MODEL_NAMES[@]} ]]; then
			selected_model="${_WHISPER_MODEL_NAMES[$choice]}"
		else
			selected_model="$current_model"
		fi
	else
		if [[ "$cancel_mode" == "cancel" ]]; then
			echo "  Model change canceled."
			return 0
		fi
		selected_model="$current_model"
	fi

	if ! whisper_dictate_download_model "$target_user" "$target_home" "$selected_model"; then
		return 1
	fi

	whisper_dictate_write_config "$target_user" "$target_home" "$selected_model"
	echo "  Selected model: ${selected_model}"
	echo "  Config: $(whisper_dictate_config_file "$target_home")"
}

whisper_dictate_action_change_model()
{
	local target_user="${SUDO_USER:-}"

	if [[ $EUID -ne 0 || -z "$target_user" || "$target_user" == "root" ]]; then
		echo "  ERROR: Change model requires the TUI to be launched with:"
		echo "    sudo ./zenbook-tweaks"
		return 1
	fi

	local target_home whisper_bin
	target_home=$(getent passwd "$target_user" | cut -d: -f6)
	whisper_bin="$target_home/.local/share/whisper.cpp/build/bin/whisper-cli"

	if [[ ! -x "$whisper_bin" ]]; then
		echo "  WARNING: whisper-cli was not found at:"
		echo "    ${whisper_bin}"
		echo "  Reinstall this tweak if transcription is not working."
		echo ""
	fi

	if ! whisper_dictate_select_model "$target_user" "$target_home" "cancel"; then
		return 1
	fi

	whisper_dictate_ensure_vad_model "$target_user" "$target_home"
}

tweak_pre_install()
{
	local target_user="${SUDO_USER:-}"
	if [[ -z "$target_user" ]]; then
		echo "  ERROR: Cannot determine user (SUDO_USER not set)."
		echo "  Run with: sudo ./zenbook-tweaks"
		return 1
	fi

	local target_home
	target_home=$(getent passwd "$target_user" | cut -d: -f6)

	# --- Install system packages ---
	local pkgs=(alsa-utils ydotool wl-clipboard libnotify cmake gcc-c++ git curl SDL2-devel)
	echo "  Installing system packages..."
	if dnf install -y "${pkgs[@]}" >/dev/null 2>&1; then
		echo "  Done."
	else
		echo "  WARNING: Package install reported errors. Continuing."
	fi
	echo ""

	# --- Enable ydotoold ---
	local ydotool_unit=""
	if systemctl cat ydotoold.service >/dev/null 2>&1; then
		ydotool_unit="ydotoold.service"
	elif systemctl cat ydotool.service >/dev/null 2>&1; then
		ydotool_unit="ydotool.service"
	fi

	if [[ -z "$ydotool_unit" ]]; then
		echo "  WARNING: No ydotool systemd service unit found. Continuing."
	elif ! systemctl is-active --quiet "$ydotool_unit" 2>/dev/null; then
		if systemctl enable --now "$ydotool_unit" >/dev/null 2>&1; then
			echo "  Enabled ${ydotool_unit}"
		else
			echo "  WARNING: Could not enable ${ydotool_unit}. Continuing."
		fi
	else
		echo "  ${ydotool_unit} already running"
	fi
	echo ""

	# --- Build whisper.cpp ---
	local whisper_dir="$target_home/.local/share/whisper.cpp"
	local whisper_bin="$whisper_dir/build/bin/whisper-cli"

	if [[ -x "$whisper_bin" ]]; then
		echo "  whisper.cpp already built at ${whisper_dir}"
	else
		echo "  whisper.cpp needs to be cloned and compiled."
		echo "  Location: ${whisper_dir}"
		echo "  Estimated: ~500MB disk, a few minutes to build."
		echo ""
		local answer
		read -rp "  Continue? [Y/n] " answer </dev/tty
		if [[ "${answer,,}" == "n" ]]; then
			echo "  Skipping whisper.cpp build. The script will not work without it."
			return 0
		fi

		echo ""
		echo "  Cloning whisper.cpp..."
		sudo -u "$target_user" git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git "$whisper_dir" 2>&1 || true

		echo "  Building whisper.cpp (this may take a few minutes)..."
		sudo -u "$target_user" cmake -S "$whisper_dir" -B "$whisper_dir/build" -DCMAKE_BUILD_TYPE=Release >/dev/null 2>&1
		sudo -u "$target_user" cmake --build "$whisper_dir/build" -j"$(nproc)" 2>&1

		if [[ ! -x "$whisper_bin" ]]; then
			echo "  ERROR: Build failed — whisper-cli not found at ${whisper_bin}"
			return 1
		fi
		echo "  Build complete."
	fi
	echo ""

	# --- Select/download transcription model ---
	echo "  Choose the local Whisper model to use."
	echo "  Missing models are downloaded only when selected."
	echo ""
	if ! whisper_dictate_select_model "$target_user" "$target_home" "default"; then
		return 1
	fi
	echo ""

	# --- Download/repair VAD model ---
	if ! whisper_dictate_ensure_vad_model "$target_user" "$target_home"; then
		return 1
	fi
	echo ""
}

tweak_post_install()
{
	echo ""
	echo "  Key binding is up to you."
	echo "  Example setup: Copilot remapped to F12 with input-remapper."
	echo "  Then in KDE:"
	echo "    System Settings → Shortcuts → Add New → Command/Script"
	echo "    Command: whisper-dictate-toggle"
	echo "    Trigger: your chosen key (F12 in the example)"
}

tweak_pre_uninstall()
{
	local target_user="${SUDO_USER:-}"
	if [[ -z "$target_user" ]]; then
		return 0
	fi

	local target_home
	target_home=$(getent passwd "$target_user" | cut -d: -f6)
	local whisper_dir="$target_home/.local/share/whisper.cpp"

	if [[ -d "$whisper_dir" ]]; then
		echo ""
		echo "  whisper.cpp is installed at: ${whisper_dir}"
		local answer
		read -rp "  Also remove whisper.cpp and models? [y/N] " answer </dev/tty
		if [[ "${answer,,}" == "y" ]]; then
			rm -rf "$whisper_dir"
			echo "  Removed ${whisper_dir}"
		else
			echo "  Keeping ${whisper_dir}"
		fi
	fi
}

tweak_post_uninstall()
{
	echo "  Note: ydotoold.service left enabled (may be used by other tools)."
}
