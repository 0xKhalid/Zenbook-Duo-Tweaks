# Tweak: hibernation-fix
# Avoid the verified PowerDevil and device-driver rollback paths only for hibernation.

TWEAK_NAME="hibernation-fix"
TWEAK_DESCRIPTION="Fix first-attempt taskbar and lid hibernation"
TWEAK_SUMMARY="Fixes first-attempt hibernation from both the KDE taskbar and lid close."

TWEAK_INFO="Fixes a Panther Lake Bluetooth driver failure that cancels the
first hibernation after its memory image has already been written.

This tweak is deliberately limited to the verified UX8407AA controller:
  PCI address: 0000:00:14.7
  PCI ID:      8086:e476
  Driver:      btintel_pcie

Before hibernation, systemd runs a helper that verifies and unbinds only this
Bluetooth controller. After resume or any failed attempt, systemd always runs
the matching restore action. Ordinary suspend is not changed.

When the physical ASUS keyboard (USB 0b05:1cd7) is attached, the helper saves
its wake setting and temporarily unbinds that exact composite USB device. This
prevents its host-controller activity from cancelling the saved image. The
keyboard, touchpad, and original wake setting are restored after resume or
rollback. The parent xHCI controller and every unrelated USB, AC, power-button,
and Thunderbolt wake source remain unchanged.

For lid-close hibernation, a narrowly scoped D-Bus activation wrapper checks the
physical ACPI lid state. With the lid closed it prevents KDE PowerDevil from
writing /sys/power/wakeup_count, which otherwise makes a pending platform event
cancel hibernation on this machine. With the lid open it delegates unchanged to
KDE's packaged helper, preserving its ordinary suspend behavior. A short-lived
guard watches the physical lid while KDE's helper remains cached on D-Bus; if
the lid closes, it terminates that stale helper so the closed-lid decision is
always evaluated again instead of reusing the open-lid process.

Installation first performs one guarded keyboard/Bluetooth disconnect and
restore cycle. Only after that succeeds does it archive, disable, and remove the
old one-second lid polling watcher. The exact previous watcher files and service
state are kept with strict state and checksum validation. Uninstall restores
them exactly when they existed before installation and refuses unsafe rollback
data.

No package, swap, resume argument, logind/KDE lid setting, firmware, pairing,
wake source, or unrelated power setting is changed.

Installed files:
  /usr/local/bin/ux8407aa-hibernate-bluetooth
  /usr/local/libexec/ux8407aa-powerdevil-wakeupsourcehelper
  /etc/systemd/system/systemd-hibernate.service.d/
    10-ux8407aa-hibernate-bluetooth.conf
  /etc/dbus-1/system-services/
    org.kde.powerdevil.wakeupsourcehelper.service

Validate after install:
  - Use Hibernation fix status
  - Use Test keyboard and Bluetooth recovery
  - Hibernate once from KDE with the lid open
  - Hibernate once by closing the lid while attended on a desk
  - Confirm Bluetooth devices reconnect after resume"

TWEAK_FILES=(
	"ux8407aa-hibernate-bluetooth:/usr/local/bin/ux8407aa-hibernate-bluetooth:755"
	"10-ux8407aa-hibernate-bluetooth.conf:/etc/systemd/system/systemd-hibernate.service.d/10-ux8407aa-hibernate-bluetooth.conf:644"
	"ux8407aa-powerdevil-wakeupsourcehelper:/usr/local/libexec/ux8407aa-powerdevil-wakeupsourcehelper:755"
	"org.kde.powerdevil.wakeupsourcehelper.service:/etc/dbus-1/system-services/org.kde.powerdevil.wakeupsourcehelper.service:644"
)

TWEAK_ACTIONS=(
	"Hibernation fix status:hibernation_fix_action_status"
	"Test keyboard and Bluetooth recovery:hibernation_fix_action_test"
	"Restore hibernation devices now:hibernation_fix_action_restore"
)

_HF_SOURCE_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
_HF_HELPER_SOURCE="${_HF_SOURCE_DIR}/ux8407aa-hibernate-bluetooth"
_HF_HELPER_DEST="/usr/local/bin/ux8407aa-hibernate-bluetooth"
_HF_DROPIN_SOURCE="${_HF_SOURCE_DIR}/10-ux8407aa-hibernate-bluetooth.conf"
_HF_DROPIN_DEST="/etc/systemd/system/systemd-hibernate.service.d/10-ux8407aa-hibernate-bluetooth.conf"
_HF_WAKEUP_WRAPPER_SOURCE="${_HF_SOURCE_DIR}/ux8407aa-powerdevil-wakeupsourcehelper"
_HF_WAKEUP_WRAPPER_DEST="/usr/local/libexec/ux8407aa-powerdevil-wakeupsourcehelper"
_HF_DBUS_SERVICE_SOURCE="${_HF_SOURCE_DIR}/org.kde.powerdevil.wakeupsourcehelper.service"
_HF_DBUS_SERVICE_DEST="/etc/dbus-1/system-services/org.kde.powerdevil.wakeupsourcehelper.service"
_HF_ORIGINAL_WAKEUP_HELPER="/usr/libexec/kf6/kauth/wakeupsourcehelper"
_HF_LID_STATE_FILE="/proc/acpi/button/lid/LID/state"
_HF_MARKER_FILE="/run/ux8407aa-hibernate-bluetooth.prepared"
_HF_LEGACY_UNIT="/etc/systemd/system/lid-hibernate-watch.service"
_HF_LEGACY_SCRIPT="/usr/local/libexec/lid-hibernate-watch"
_HF_STATE_FILE="${STATE_DIR}/hibernation-fix.legacy-watcher"
_HF_BACKUP_ROOT="${BACKUP_DIR}/hibernation-fix"
_HF_BACKUP_UNIT="${_HF_BACKUP_ROOT}${_HF_LEGACY_UNIT}"
_HF_BACKUP_SCRIPT="${_HF_BACKUP_ROOT}${_HF_LEGACY_SCRIPT}"
_HF_PREEXISTING_SAME=()

_hf_state_value()
{
	local key="$1"
	awk -F= -v key="${key}" '$1 == key { print substr($0, index($0, "=") + 1); exit }' "${_HF_STATE_FILE}" 2>/dev/null
}

_hf_sha256_matches()
{
	local path="$1"
	local expected="$2"
	local actual

	[[ "${expected}" =~ ^[0-9a-f]{64}$ ]] || return 1
	[[ -f "${path}" && ! -L "${path}" ]] || return 1
	actual="$(sha256sum -- "${path}" | awk '{print $1}')" || return 1
	[[ "${actual}" == "${expected}" ]]
}

_hf_legacy_state_valid()
{
	local unit_present script_present unit_enabled unit_active unit_sha256 script_sha256

	[[ -f "${_HF_STATE_FILE}" && ! -L "${_HF_STATE_FILE}" ]] || return 1
	awk -F= '
		BEGIN {
			expected["version"] = 1
			expected["unit_present"] = 1
			expected["script_present"] = 1
			expected["unit_enabled"] = 1
			expected["unit_active"] = 1
			expected["unit_sha256"] = 1
			expected["script_sha256"] = 1
		}
		NF != 2 || !($1 in expected) || seen[$1]++ { invalid = 1 }
		END {
			for (key in expected) {
				if (seen[key] != 1) invalid = 1
			}
			exit invalid
		}
	' "${_HF_STATE_FILE}" || return 1
	[[ "$(_hf_state_value version)" == 1 ]] || return 1

	unit_present="$(_hf_state_value unit_present)"
	script_present="$(_hf_state_value script_present)"
	unit_enabled="$(_hf_state_value unit_enabled)"
	unit_active="$(_hf_state_value unit_active)"
	unit_sha256="$(_hf_state_value unit_sha256)"
	script_sha256="$(_hf_state_value script_sha256)"
	[[ "${unit_present}" == 0 || "${unit_present}" == 1 ]] || return 1
	[[ "${script_present}" == 0 || "${script_present}" == 1 ]] || return 1

	if [[ "${unit_present}" == 1 ]]; then
		[[ "${unit_enabled}" == enabled || "${unit_enabled}" == disabled ]] || return 1
		[[ "${unit_active}" == active || "${unit_active}" == inactive ]] || return 1
		_hf_sha256_matches "${_HF_BACKUP_UNIT}" "${unit_sha256}" || return 1
	else
		[[ "${unit_enabled}" == not-found && "${unit_active}" == inactive && "${unit_sha256}" == none ]] || return 1
		[[ ! -e "${_HF_BACKUP_UNIT}" && ! -L "${_HF_BACKUP_UNIT}" ]] || return 1
	fi

	if [[ "${script_present}" == 1 ]]; then
		_hf_sha256_matches "${_HF_BACKUP_SCRIPT}" "${script_sha256}" || return 1
	else
		[[ "${script_sha256}" == none && ! -e "${_HF_BACKUP_SCRIPT}" && ! -L "${_HF_BACKUP_SCRIPT}" ]] || return 1
	fi
}

_hf_hibernation_is_active()
{
	systemctl is-active --quiet systemd-hibernate.service 2>/dev/null
}

_hf_require_commands()
{
	local command_name
	local commands=(awk basename bluetoothctl cmp find flock grep logger modprobe readlink seq sha256sum systemctl systemd-run)

	for command_name in "${commands[@]}"; do
		if ! command -v "${command_name}" >/dev/null 2>&1; then
			echo "  ERROR: Required command is unavailable: ${command_name}"
			return 1
		fi
	done
}

_hf_validate_powerdevil_bypass_platform()
{
	local lid_state

	[[ -f "${_HF_ORIGINAL_WAKEUP_HELPER}" && -x "${_HF_ORIGINAL_WAKEUP_HELPER}" ]] || {
		echo "  ERROR: KDE's original wakeup-count helper is unavailable."
		return 1
	}
	[[ -r "${_HF_LID_STATE_FILE}" ]] || {
		echo "  ERROR: The physical ACPI lid state is unavailable."
		return 1
	}
	lid_state="$(awk -F: 'NR == 1 { gsub(/[[:space:]]/, "", $2); print tolower($2) }' "${_HF_LID_STATE_FILE}")"
	[[ "${lid_state}" == open || "${lid_state}" == closed ]] || {
		echo "  ERROR: The physical ACPI lid state is invalid."
		return 1
	}
	systemctl is-active --quiet dbus-broker.service || {
		echo "  ERROR: The system D-Bus broker is not active."
		return 1
	}
}

_hf_reload_system_bus()
{
	systemctl reload dbus-broker.service
}

_hf_powerdevil_bypass_present()
{
	[[ -f "${_HF_WAKEUP_WRAPPER_DEST}" && -f "${_HF_DBUS_SERVICE_DEST}" ]] || return 1
	cmp -s "${_HF_WAKEUP_WRAPPER_SOURCE}" "${_HF_WAKEUP_WRAPPER_DEST}" || return 1
	cmp -s "${_HF_DBUS_SERVICE_SOURCE}" "${_HF_DBUS_SERVICE_DEST}" || return 1
}

_hf_helper()
{
	local helper="${_HF_HELPER_DEST}"
	[[ -x "${helper}" ]] || helper="${_HF_HELPER_SOURCE}"
	"${helper}" "$@"
}

_hf_cancel_restore_guard()
{
	systemctl stop zenbook-hibernation-fix-restore-guard.timer \
		zenbook-hibernation-fix-restore-guard.service 2>/dev/null || true
	systemctl reset-failed zenbook-hibernation-fix-restore-guard.service 2>/dev/null || true
}

_hf_run_recovery_test()
{
	local helper="$1"

	_hf_cancel_restore_guard
	if ! systemd-run --quiet --unit=zenbook-hibernation-fix-restore-guard \
		--on-active=30s --timer-property=AccuracySec=1s "${helper}" restore
	then
		echo "  ERROR: Could not arm the automatic device-restore guard."
		return 1
	fi
	if ! "${helper}" prepare; then
		echo "  Device preparation failed; the restore guard remains armed briefly."
		return 1
	fi
	if ! "${helper}" restore; then
		echo "  Device recovery failed; the restore guard will retry automatically."
		return 1
	fi
	_hf_cancel_restore_guard
}

_hf_effective_hooks_present()
{
	local start_pre stop_post

	start_pre="$(systemctl show systemd-hibernate.service -p ExecStartPre --value 2>/dev/null || true)"
	stop_post="$(systemctl show systemd-hibernate.service -p ExecStopPost --value 2>/dev/null || true)"
	[[ "${start_pre}" == *"/usr/local/bin/ux8407aa-hibernate-bluetooth prepare"* &&
		"${stop_post}" == *"/usr/local/bin/ux8407aa-hibernate-bluetooth restore"* ]]
}

_hf_archive_legacy_watcher()
{
	local unit_present=0 script_present=0 unit_enabled=not-found unit_active=inactive
	local unit_sha256=none script_sha256=none state_tmp

	if [[ -e "${_HF_STATE_FILE}" || -L "${_HF_STATE_FILE}" ]]; then
		_hf_legacy_state_valid || {
			echo "  ERROR: Legacy watcher rollback state or backups are invalid."
			return 1
		}
		return 0
	fi
	if [[ -e "${_HF_BACKUP_UNIT}" || -L "${_HF_BACKUP_UNIT}" ||
		-e "${_HF_BACKUP_SCRIPT}" || -L "${_HF_BACKUP_SCRIPT}" ]]
	then
		echo "  ERROR: Orphaned legacy watcher backups exist without a state record."
		return 1
	fi
	mkdir -p "${STATE_DIR}"
	if [[ -f "${_HF_LEGACY_UNIT}" ]]; then
		unit_present=1
		mkdir -p "$(dirname "${_HF_BACKUP_UNIT}")"
		cp -a "${_HF_LEGACY_UNIT}" "${_HF_BACKUP_UNIT}"
		cmp -s "${_HF_LEGACY_UNIT}" "${_HF_BACKUP_UNIT}" || return 1
		unit_sha256="$(sha256sum "${_HF_LEGACY_UNIT}" | awk '{print $1}')"
		unit_enabled="$(systemctl is-enabled lid-hibernate-watch.service 2>/dev/null || true)"
		systemctl is-active --quiet lid-hibernate-watch.service 2>/dev/null && unit_active=active
		[[ "${unit_enabled}" == enabled || "${unit_enabled}" == disabled ]] || {
			echo "  ERROR: Unsupported legacy watcher enablement state: ${unit_enabled:-unknown}"
			rm -f -- "${_HF_BACKUP_UNIT}"
			return 1
		}
	fi
	if [[ -f "${_HF_LEGACY_SCRIPT}" ]]; then
		script_present=1
		mkdir -p "$(dirname "${_HF_BACKUP_SCRIPT}")"
		cp -a "${_HF_LEGACY_SCRIPT}" "${_HF_BACKUP_SCRIPT}"
		cmp -s "${_HF_LEGACY_SCRIPT}" "${_HF_BACKUP_SCRIPT}" || return 1
		script_sha256="$(sha256sum "${_HF_LEGACY_SCRIPT}" | awk '{print $1}')"
	fi

	state_tmp="${_HF_STATE_FILE}.tmp.$$"
	umask 077
	{
		printf 'version=1\n'
		printf 'unit_present=%s\n' "${unit_present}"
		printf 'script_present=%s\n' "${script_present}"
		printf 'unit_enabled=%s\n' "${unit_enabled}"
		printf 'unit_active=%s\n' "${unit_active}"
		printf 'unit_sha256=%s\n' "${unit_sha256}"
		printf 'script_sha256=%s\n' "${script_sha256}"
	} > "${state_tmp}"
	mv -f "${state_tmp}" "${_HF_STATE_FILE}"
	_hf_legacy_state_valid || {
		echo "  ERROR: Could not verify the archived legacy watcher state."
		rm -f -- "${_HF_STATE_FILE}" "${_HF_BACKUP_UNIT}" "${_HF_BACKUP_SCRIPT}"
		return 1
	}
}

_hf_retire_legacy_watcher()
{
	local unit_present script_present

	_hf_legacy_state_valid || {
		echo "  ERROR: Legacy watcher rollback state or backups are invalid."
		return 1
	}
	unit_present="$(_hf_state_value unit_present)"
	script_present="$(_hf_state_value script_present)"
	systemctl disable --now lid-hibernate-watch.service 2>/dev/null || true
	if [[ "${unit_present}" == 1 && -f "${_HF_LEGACY_UNIT}" ]]; then
		cmp -s "${_HF_LEGACY_UNIT}" "${_HF_BACKUP_UNIT}" || {
			echo "  ERROR: Legacy watcher unit changed after backup; refusing removal."
			return 1
		}
		rm -f -- "${_HF_LEGACY_UNIT}"
	fi
	if [[ "${script_present}" == 1 && -f "${_HF_LEGACY_SCRIPT}" ]]; then
		cmp -s "${_HF_LEGACY_SCRIPT}" "${_HF_BACKUP_SCRIPT}" || {
			echo "  ERROR: Legacy watcher script changed after backup; refusing removal."
			return 1
		}
		rm -f -- "${_HF_LEGACY_SCRIPT}"
	fi
	systemctl daemon-reload
	! systemctl is-active --quiet lid-hibernate-watch.service 2>/dev/null
}

_hf_restore_legacy_watcher()
{
	local preserve_state="${1:-false}"
	local unit_present script_present unit_enabled unit_active unit_sha256 script_sha256
	local restored_enabled restored_active

	[[ -f "${_HF_STATE_FILE}" ]] || return 0
	_hf_legacy_state_valid || {
		echo "  ERROR: Legacy watcher rollback state or backup checksum is invalid."
		return 1
	}
	unit_present="$(_hf_state_value unit_present)"
	script_present="$(_hf_state_value script_present)"
	unit_enabled="$(_hf_state_value unit_enabled)"
	unit_active="$(_hf_state_value unit_active)"
	unit_sha256="$(_hf_state_value unit_sha256)"
	script_sha256="$(_hf_state_value script_sha256)"

	if [[ "${unit_present}" == 1 ]]; then
		[[ -f "${_HF_BACKUP_UNIT}" ]] || {
			echo "  ERROR: Legacy watcher unit backup is missing."
			return 1
		}
		mkdir -p "$(dirname "${_HF_LEGACY_UNIT}")"
		cp -a "${_HF_BACKUP_UNIT}" "${_HF_LEGACY_UNIT}"
		_hf_sha256_matches "${_HF_LEGACY_UNIT}" "${unit_sha256}" || {
			echo "  ERROR: Restored legacy watcher unit failed checksum verification."
			return 1
		}
	fi
	if [[ "${script_present}" == 1 ]]; then
		[[ -f "${_HF_BACKUP_SCRIPT}" ]] || {
			echo "  ERROR: Legacy watcher script backup is missing."
			return 1
		}
		mkdir -p "$(dirname "${_HF_LEGACY_SCRIPT}")"
		cp -a "${_HF_BACKUP_SCRIPT}" "${_HF_LEGACY_SCRIPT}"
		_hf_sha256_matches "${_HF_LEGACY_SCRIPT}" "${script_sha256}" || {
			echo "  ERROR: Restored legacy watcher script failed checksum verification."
			return 1
		}
	fi
	systemctl daemon-reload
	if [[ "${unit_present}" == 1 ]]; then
		if [[ "${unit_enabled}" == enabled ]]; then
			systemctl enable lid-hibernate-watch.service
		else
			systemctl disable lid-hibernate-watch.service 2>/dev/null || true
		fi
		if [[ "${unit_active}" == active ]]; then
			systemctl start lid-hibernate-watch.service
		else
			systemctl stop lid-hibernate-watch.service 2>/dev/null || true
		fi
		restored_enabled="$(systemctl is-enabled lid-hibernate-watch.service 2>/dev/null || true)"
		systemctl is-active --quiet lid-hibernate-watch.service 2>/dev/null && restored_active=active || restored_active=inactive
		[[ "${restored_enabled}" == "${unit_enabled}" && "${restored_active}" == "${unit_active}" ]] || {
			echo "  ERROR: Legacy watcher service state was not restored exactly."
			return 1
		}
	fi

	if [[ "${preserve_state}" != true ]]; then
		rm -f -- "${_HF_STATE_FILE}" "${_HF_BACKUP_UNIT}" "${_HF_BACKUP_SCRIPT}"
		find "${_HF_BACKUP_ROOT}" -type d -empty -delete 2>/dev/null || true
	fi
}

_hf_record_preexisting_files()
{
	local entry src dest perm src_path

	_HF_PREEXISTING_SAME=()
	for entry in "${TWEAK_FILES[@]}"; do
		IFS=':' read -r src dest perm <<< "${entry}"
		src_path="${_HF_SOURCE_DIR}/${src}"
		if [[ -f "${dest}" ]] && cmp -s "${src_path}" "${dest}"; then
			_HF_PREEXISTING_SAME+=("${dest}")
		fi
	done
}

_hf_was_preexisting_same()
{
	local wanted="$1"
	local dest

	for dest in "${_HF_PREEXISTING_SAME[@]}"; do
		[[ "${dest}" == "${wanted}" ]] && return 0
	done
	return 1
}

_hf_rollback_managed_files()
{
	local entry src dest perm backup

	for entry in "${TWEAK_FILES[@]}"; do
		IFS=':' read -r src dest perm <<< "${entry}"
		_hf_was_preexisting_same "${dest}" && continue
		rm -f -- "${dest}"
		backup="${BACKUP_DIR}/${TWEAK_NAME}${dest}"
		if [[ -f "${backup}" ]]; then
			mkdir -p "$(dirname "${dest}")"
			cp -a "${backup}" "${dest}"
			rm -f -- "${backup}"
		fi
	done
	find "${BACKUP_DIR}/${TWEAK_NAME}" -type d -empty -delete 2>/dev/null || true
}

_hf_abort_install()
{
	_hf_cancel_restore_guard
	_hf_helper restore >/dev/null 2>&1 || true
	_hf_restore_legacy_watcher || true
	_hf_rollback_managed_files
	systemctl daemon-reload || true
	_hf_reload_system_bus || true
}

tweak_pre_install()
{
	_hf_require_commands || return 1
	_hf_validate_powerdevil_bypass_platform || return 1
	if _hf_hibernation_is_active; then
		echo "  ERROR: Cannot install while hibernation is active."
		return 1
	fi
	_hf_record_preexisting_files
	echo "  Testing the ASUS keyboard and Intel Bluetooth recovery cycle..."
	if ! _hf_run_recovery_test "${_HF_HELPER_SOURCE}"; then
		echo "  ERROR: Device recovery test failed; the lid watcher was not changed."
		return 1
	fi
	echo "  Keyboard and Bluetooth recovery test passed."
}

tweak_post_install()
{
	if ! systemctl daemon-reload || ! _hf_effective_hooks_present; then
		echo "  ERROR: Hibernate hooks did not load; rolling back installation."
		_hf_abort_install
		return 1
	fi
	if ! _hf_reload_system_bus || ! _hf_powerdevil_bypass_present; then
		echo "  ERROR: PowerDevil's lid-hibernation bypass did not load; rolling back installation."
		_hf_abort_install
		return 1
	fi
	if ! _hf_archive_legacy_watcher || ! _hf_retire_legacy_watcher; then
		echo "  ERROR: Could not safely retire the legacy watcher; rolling back installation."
		_hf_abort_install
		return 1
	fi
	echo "  Installed automatic keyboard and Bluetooth handling for hibernation only."
	echo "  Installed the closed-lid PowerDevil wakeup-count bypass."
	echo "  Archived and removed the legacy polling lid watcher."
}

tweak_pre_uninstall()
{
	_hf_cancel_restore_guard
	if _hf_hibernation_is_active; then
		echo "  ERROR: Cannot uninstall while hibernation is active."
		return 1
	fi
	if ! _hf_helper restore; then
		echo "  ERROR: Hibernation devices could not be restored; uninstall aborted."
		return 1
	fi
	if ! _hf_restore_legacy_watcher true; then
		echo "  ERROR: The previous lid watcher could not be restored; uninstall aborted."
		return 1
	fi
}

tweak_post_uninstall()
{
	systemctl daemon-reload || return 1
	_hf_reload_system_bus || return 1
	_hf_restore_legacy_watcher || return 1
	"${_HF_HELPER_SOURCE}" status || return 1
	echo "  Removed hibernation device handling and the PowerDevil lid bypass."
	if [[ -f "${_HF_LEGACY_UNIT}" || -f "${_HF_LEGACY_SCRIPT}" ]]; then
		echo "  Restored the previous lid watcher and its service state."
	fi
}

tweak_status_check()
{
	local installed=0 modified=0 total="${#TWEAK_FILES[@]}"
	local entry src dest perm

	for entry in "${TWEAK_FILES[@]}"; do
		IFS=':' read -r src dest perm <<< "${entry}"
		[[ -f "${dest}" ]] && installed=$((installed + 1))
	done
	if [[ "${installed}" -eq 0 ]]; then
		[[ -e "${_HF_STATE_FILE}" || -L "${_HF_STATE_FILE}" ]] && echo "partially installed" || echo "not installed"
		return
	fi
	if [[ "${installed}" -lt "${total}" ]]; then
		echo "partially installed"
		return
	fi
	cmp -s "${_HF_HELPER_SOURCE}" "${_HF_HELPER_DEST}" || modified=1
	cmp -s "${_HF_DROPIN_SOURCE}" "${_HF_DROPIN_DEST}" || modified=1
	_hf_powerdevil_bypass_present || modified=1
	_hf_effective_hooks_present || modified=1
	_hf_legacy_state_valid || modified=1
	[[ ! -e "${_HF_LEGACY_UNIT}" && ! -e "${_HF_LEGACY_SCRIPT}" ]] || modified=1
	[[ ! -f "${_HF_MARKER_FILE}" ]] || modified=1
	_hf_helper status >/dev/null 2>&1 || modified=1
	if [[ "${modified}" -eq 1 ]]; then
		echo "installed (modified)"
	else
		echo "installed"
	fi
}

hibernation_fix_action_status()
{
	local lid_state

	_hf_helper status
	lid_state="$(awk -F: 'NR == 1 { gsub(/[[:space:]]/, "", $2); print tolower($2) }' "${_HF_LID_STATE_FILE}" 2>/dev/null || true)"
	if _hf_powerdevil_bypass_present; then
		echo "PowerDevil closed-lid bypass: installed; lid=${lid_state:-unknown}"
	else
		echo "PowerDevil closed-lid bypass: missing or modified"
	fi
	if _hf_legacy_state_valid; then
		echo "Legacy watcher rollback: archived and checksum-verified"
	elif [[ -e "${_HF_STATE_FILE}" || -L "${_HF_STATE_FILE}" ]]; then
		echo "Legacy watcher rollback: INVALID"
	else
		echo "Legacy watcher rollback: no installation record"
	fi
}

hibernation_fix_action_test()
{
	echo "  The ASUS keyboard and Bluetooth devices will disconnect briefly and recover automatically."
	_hf_run_recovery_test "${_HF_HELPER_DEST}" || return 1
	echo "  Keyboard and Bluetooth recovery test passed."
}

hibernation_fix_action_restore()
{
	_hf_helper restore || return 1
	_hf_helper status
}
